-ln" marker-end="url(#seq-order-ah2)"/><text x="624.0" y="195.0" text-anchor="middle" class="ad-lb2">update каждый кадр</text><line x1="546.0" y1="234.0" x2="700.0" y2="234.0" class="ad-ln" marker-end="url(#seq-order-ah2)"/><text x="624.0" y="229.0" text-anchor="middle" class="ad-lb2">find_path (A*)</text><line x1="702.0" y1="268.0" x2="548.0" y2="268.0" class="ad-ln ad-ds" marker-end="url(#seq-order-ah2)"/><text x="624.0" y="263.0" text-anchor="middle" class="ad-lb2">путь</text><rect x="472.0" y="290.0" width="148.0" height="22" rx="4" class="ad-note"/><text x="546.0" y="305.0" text-anchor="middle" class="ad-t2">идёт, добывает, бьёт</text><line x1="546.0" y1="336.0" x2="392.0" y2="336.0" class="ad-ln" marker-end="url(#seq-order-ah2)"/><text x="468.0" y="331.0" text-anchor="middle" class="ad-lb2">on_idle: из очереди</text></svg>