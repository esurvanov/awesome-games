<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Житьё — ассеты</title>
<style>
  html, body { margin: 0; height: 100%; background: #20242b; overflow: hidden; font: 12px system-ui, sans-serif; }
  #hud { position: fixed; left: 8px; top: 6px; color: #cfd6e0; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud"></div>
<script type="module">
// Превью ассетов: ?view=furniture | anims | chars  (&char=male|female, &t=0..1 доля клипа, &cam=front|back|top)
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import * as M from '../js/render/manifest.js';
const { MODELS, CHARACTERS, ANIMS } = M;
import { CATALOG } from '../data/catalog.js';

const q = new URLSearchParams(location.search);
const view = q.get('view') || 'furniture';
const root = new URL('../', location.href);
const url = (u) => new URL(u, root).href;
const hud = document.getElementById('hud');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a2f38);
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a3228, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(8, 14, 10); scene.add(sun);
const loader = new GLTFLoader();
const load = (u) => loader.loadAsync(url(u));

function label(text, x, y, z, size = 0.32, color = '#ffffff') {
  const c = document.createElement('canvas'); c.width = 512; c.height = 64;
  const g = c.getContext('2d'); g.font = 'bold 40px system-ui'; g.fillStyle = color; g.textAlign = 'center'; g.fillText(text, 256, 46);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  s.scale.set(size * 8, size, 1); s.position.set(x, y, z); scene.add(s); return s;
}
function outline(w, d, x, z, color = 0xffd23f) {
  const p = [[-w / 2, -d / 2], [w / 2, -d / 2], [w / 2, d / 2], [-w / 2, d / 2], [-w / 2, -d / 2]].map(([a, b]) => new THREE.Vector3(x + a, 0.005, z + b));
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p), new THREE.LineBasicMaterial({ color })));
}
function arrowZ(x, z, len = 0.6) { const a = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(x, 0.02, z), len, 0xff3b3b, 0.18, 0.12); scene.add(a); }

function camFor(cx, cz, span, dir = 'front') {
  const aspect = innerWidth / innerHeight, h = span / 2;
  const cam = new THREE.OrthographicCamera(-h * aspect, h * aspect, h, -h, -100, 200);
  const d = { front: [1, 1.1, 1.5], back: [-1, 1.1, -1.5], top: [0.001, 1, 0.001], side: [1.6, 0.6, 0.4] }[dir] || [1, 1.1, 1.5];
  cam.position.set(cx + d[0] * 20, d[1] * 20, cz + d[2] * 20); cam.lookAt(cx, 0.4, cz); return cam;
}

const stats = {};
async function furniture() {
  const per = +(q.get("per") || 999), pg = +(q.get("page") || 0);
  const ids = CATALOG.map(d => d.id).filter(id => !q.get("only") || q.get("only").split(",").includes(id)).filter(id => q.get("extra") ? CATALOG.findIndex(d => d.id === id) >= 38 && !CATALOG.find(d => d.id === id).variantOf : true).slice(pg * per, pg * per + per), cols = +(q.get("cols") || 7), step = 8;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x3a4150 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -0.002; scene.add(floor);
  await Promise.all(ids.map(async (id, i) => {
    const def = CATALOG.find(d => d.id === id), e = MODELS[id] || MODELS[def.kind];
    const x = (i % cols) * step, z = Math.floor(i / cols) * step;
    const [fw, fd] = def.fp;
    outline(fw, fd, x, z); arrowZ(x, z + fd / 2 - 0.05, 0.5);
    label(id, x, -0.05, z + fd / 2 + 0.55, 0.3, e ? '#ffffff' : '#ff6060');
    if (def.place === 'wall') { // стена 1 м × 3 м, толщина 0.15 (как WALL_T у Рендера)
      const back = e?.mount === 'wall-back';
      const wall = new THREE.Mesh(new THREE.BoxGeometry(1, 2.6, 0.15), new THREE.MeshStandardMaterial({ color: 0x8c96a6, transparent: true, opacity: 0.55 }));
      wall.position.set(x, 1.3, z + (back ? -0.075 : 0)); scene.add(wall);
    }
    if (!e) return;
    const g = await load(e.url); const m = g.scene;
    const inner = new THREE.Group(); inner.add(m); inner.rotation.y = e.rotY || 0; inner.scale.setScalar(e.scale || 1);
    if (e.tint) m.traverse(o => { if (!o.isMesh) return; o.material = o.material.clone(); if (typeof e.tint === 'string') o.material.color.multiply(new THREE.Color(e.tint)); else if (e.tint[o.material.name]) o.material.color = new THREE.Color(e.tint[o.material.name]); });
    inner.position.set(x, e.yOffset || 0, z); scene.add(inner);
    if (e.mount === 'surface') { const t = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.75, 0.6), new THREE.MeshStandardMaterial({ color: 0x6b5a48 })); t.position.set(x, 0.375, z); scene.add(t); inner.position.y = 0.75; }
    const b = new THREE.Box3().setFromObject(inner); let tris = 0;
    m.traverse(o => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
    stats[id] = { size: b.getSize(new THREE.Vector3()).toArray().map(v => +v.toFixed(2)), minY: +b.min.y.toFixed(3), tris };
  }));
  const rows = Math.ceil(ids.length / cols);
  // по ячейке на предмет: свой орто-кадр (scissor), вид спереди-справа (+Z, +X)
  return { cells: ids.map((id, i) => ({ x: (i % cols) * step, z: Math.floor(i / cols) * step })), cols, rows };
}

async function chars() {
  const out = [];
  const set = q.get('urls') ? Object.fromEntries(q.get('urls').split(',').map((u, i) => [i + ':' + u.split('/').slice(-2).join('/').replace('.glb', ''), { url: u }]))
    : q.get('set') === 'all' ? { ...CHARACTERS, ...(M.CHILDREN || {}) } : q.get('set') === 'legacy' ? (M.CHARACTERS_LEGACY || {}) : CHARACTERS;
  for (const [i, [k, c]] of Object.entries(set).entries()) {
    const g = await load(c.url); const m = SkeletonUtils.clone(g.scene); m.position.x = (i - (Object.keys(set).length - 1) / 2) * 1.1; scene.add(m);
    const b = new THREE.Box3().setFromObject(m); stats[k] = { size: b.getSize(new THREE.Vector3()).toArray().map(v => +v.toFixed(2)) };
    label(k, m.position.x, 2.1, 0, 0.25); out.push(m);
    arrowZ(m.position.x, 0.3, 0.5);
  }
  const a = await load(ANIMS.urls[0]); const clip = a.animations.find(c => c.name === ANIMS.clipMap.idle);
  for (const m of out) { const mx = new THREE.AnimationMixer(m); mx.clipAction(clip).play(); mx.setTime(clip.duration * 0.3); }
  const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100); cam.position.set(1.2, 1.6, 8.5); cam.lookAt(0, 0.95, 0); return cam;
}

async function anims() {
  const c = CHARACTERS[q.get('char') || 'male'];
  const [g, a] = await Promise.all([load(c.url), load(ANIMS.urls[0])]);
  const names = q.get('clips') ? q.get('clips').split(',') : Object.keys(ANIMS.clipMap);
  const cols = 8, step = 6, frac = +(q.get('t') ?? 0.5);
  const missing = []; const objs = names.map(() => []);
  names.forEach((n, i) => {
    const clipName = ANIMS.clipMap[n] || n; const clip = a.animations.find(k => k.name === clipName);
    const x = (i % cols) * step, z = Math.floor(i / cols) * 2.6;
    const m = SkeletonUtils.clone(g.scene); m.position.set(x, 0, z); scene.add(m);
    objs[i].push(m, label(`${n}`, x, 2.15, z, 0.2, clip ? '#ffffff' : '#ff6060'), label(clipName, x, 1.95, z, 0.14, '#9fb3c8'));
    if (!clip) { missing.push(n); return; }
    const mx = new THREE.AnimationMixer(m); mx.clipAction(clip).play(); mx.setTime(clip.duration * frac);
    m.updateMatrixWorld(true); const P = {};
    for (const b of ['Head', 'pelvis', 'foot_l', 'foot_r']) { const o = m.getObjectByName(b); if (o) P[b] = o.getWorldPosition(new THREE.Vector3()).sub(m.position).toArray().map(v => +v.toFixed(2)); }
    (stats.poses ||= {})[n] = P;
  });
  stats.missing = missing; stats.clips = a.animations.map(k => k.name);
  const rows = Math.ceil(names.length / cols);
  return { cells: names.map((n, i) => ({ x: (i % cols) * step, z: Math.floor(i / cols) * 2.6, span: 2.6, y: 0.85, objs: objs[i] })), cols, rows };
}

async function props() {
  const c = CHARACTERS[q.get('char') || 'male']; const P = M.PROPS || {};
  const [g, a] = await Promise.all([load(c.url), load(ANIMS.urls[0])]);
  const names = Object.keys(P), cols = 5, step = 6, objs = names.map(() => []);
  const POSE = { pizza_box: 'Walk_Carry_Loop', plate: 'Walk_Carry_Loop', book: 'Read_Loop', helmet: 'Idle_Loop', cap: 'Idle_Loop' };
  await Promise.all(names.map(async (n, i) => {
    const x = (i % cols) * step, z = Math.floor(i / cols) * 2.6;
    const m = SkeletonUtils.clone(g.scene); m.position.set(x, 0, z); scene.add(m);
    const pr = P[n]; const pg = await load(pr.url); const po = pg.scene;
    po.position.fromArray(pr.position); po.quaternion.fromArray(pr.quaternion);
    m.getObjectByName(pr.bone).add(po);
    const clip = a.animations.find(k => k.name === (POSE[n] || 'Walk_Loop'));
    const mx = new THREE.AnimationMixer(m); mx.clipAction(clip).play(); mx.setTime(clip.duration * 0.3);
    objs[i].push(m, label(n, x, 2.15, z, 0.2), label(pr.bone + ' · ' + clip.name, x, 1.95, z, 0.14, '#9fb3c8'));
  }));
  const rows = Math.ceil(names.length / cols);
  return { cells: names.map((n, i) => ({ x: (i % cols) * step, z: Math.floor(i / cols) * 2.6, span: 2.6, y: 0.9, objs: objs[i] })), cols, rows };
}
async function lib() {
  const S = M.SHAPES; let keys = Object.keys(S);
  if (q.get('group')) keys = keys.filter(k => S[k].group === q.get('group'));
  if (q.get('kind')) keys = keys.filter(k => S[k].kinds.includes(q.get('kind')));
  if (q.get('keys')) keys = q.get('keys').split(',');
  const per = +(q.get('per') || 48), page = +(q.get('page') || 0); keys = keys.slice(page * per, page * per + per);
  const cols = +(q.get('cols') || 8), step = 40, objs = keys.map(() => []);
  await Promise.all(keys.map(async (k, i) => {
    const sh = S[k], x = (i % cols) * step, z = Math.floor(i / cols) * step;
    const g = await load(sh.url); const m = g.scene; m.position.set(x, sh.ceiling ? 0 : 0, z); scene.add(m);
    const sp = Math.max(sh.size[0], sh.size[1], sh.size[2]);
    const fl = new THREE.Mesh(new THREE.PlaneGeometry(sp * 3, sp * 3), new THREE.MeshStandardMaterial({ color: 0x3a4150 })); fl.rotation.x = -Math.PI / 2; fl.position.set(x, -0.003, z); scene.add(fl);
    const ar = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(x, 0.02, z + sh.size[2] / 2), Math.max(0.3, sp * 0.3), 0xff3b3b); scene.add(ar);
    objs[i].push(m, fl, ar, label(k, x, sh.size[1] + sp * 0.25, z, sp * 0.13));
  }));
  const rows = Math.ceil(keys.length / cols);
  return { cells: keys.map((k, i) => { const sh = S[k]; const sp = Math.max(sh.size[0], sh.size[1], sh.size[2]); return { x: (i % cols) * step, z: Math.floor(i / cols) * step, span: sp * 1.7, y: sh.size[1] * 0.5, objs: objs[i] }; }), cols, rows };
}
async function cas() {
  const set = q.get('set') || 'hair_m'; const g = set.endsWith('_f') ? 'f' : 'm';
  const body = (st) => M.OUTFITS[g][st || 'casual'].url;
  let cfgs = [];
  if (q.get('hairurls')) cfgs = q.get('hairurls').split(',').map(u => ({ name: u.split('/').pop(), body: body(), hairUrl: u }));
  else if (set.startsWith('hair')) cfgs = Object.entries(M.HAIR).filter(([k, v]) => v.gender === g || v.gender === 'u').map(([k]) => ({ name: k, body: body(), hair: k }));
  else if (set.startsWith('acc')) cfgs = Object.entries(M.ACCESSORIES).filter(([k, v]) => v.gender === g).map(([k]) => ({ name: k, body: body(), hair: g === 'm' ? 'umm_casual_2' : 'umw_casual', acc: [k] }));
  else if (set.startsWith('outfit')) cfgs = Object.keys(M.OUTFITS[g]).filter(k => !q.get('only') || q.get('only').split(',').includes(k)).map(k => ({ name: k, body: body(k), hair: g === 'm' ? 'umm_casual_2' : 'umw_witch' }));
  else if (set.startsWith('body')) cfgs = ['average', 'slim', 'fit', 'heavy'].map(k => ({ name: k, body: body(), hair: g === 'm' ? 'parted' : 'long', bodyType: k }));
  const a = await load(ANIMS.urls[0]); const idle = a.animations.find(c => c.name === 'Idle_Loop');
  const close = set.startsWith('hair') || set.startsWith('acc') || !!q.get('hairurls');
  const cols = +(q.get('cols') || (close ? 8 : 6)), step = 6, objs = cfgs.map(() => []);
  await Promise.all(cfgs.map(async (c, i) => {
    const x = (i % cols) * step, z = Math.floor(i / cols) * 3;
    const gl = await load(c.body); const m = SkeletonUtils.clone(gl.scene); m.position.set(x, 0, z); scene.add(m);
    if (c.bodyType && M.BODY[c.bodyType]) for (const [b, sc] of Object.entries(M.BODY[c.bodyType])) m.getObjectByName(b)?.scale.set(...sc);
    const head = m.getObjectByName('Head');
    for (const key of [c.hairUrl || null, c.hair && M.HAIR[c.hair]?.url ? M.HAIR[c.hair].url : null, ...(c.acc || []).map(k => M.ACCESSORIES[k].url)].filter(Boolean)) { const hg = await load(key); head.add(hg.scene.clone(true)); }
    const mx = new THREE.AnimationMixer(m); const clipN = q.get('clip'); const cl = clipN ? a.animations.find(c => c.name === clipN) : idle; mx.clipAction(cl).play(); mx.setTime(cl.duration * +(q.get('t') ?? 0.16));
    objs[i].push(m, label(c.name, x, close ? 2.0 : 2.15, z + (close ? 0.2 : 0), close ? 0.06 : 0.2));
  }));
  const rows = Math.ceil(cfgs.length / cols);
  return { cells: cfgs.map((c, i) => ({ x: (i % cols) * step, z: Math.floor(i / cols) * 3 + (close ? 0.05 : 0), span: close ? 0.62 : 2.4, y: close ? 1.72 : 0.9, objs: objs[i] })), cols, rows };
}
const cam = await ({ furniture, anims, chars, props, lib, cas }[view])();
if (cam.cells) {
  const W = innerWidth, H = innerHeight, cw = W / cam.cols, ch = H / cam.rows;
  renderer.setScissorTest(true); renderer.setClearColor(0x2a2f38);
  cam.cells.forEach((c, i) => {
    cam.cells.forEach((o, j) => (o.objs || []).forEach(ob => { ob.visible = i === j; }));
    const col = i % cam.cols, row = Math.floor(i / cam.cols);
    const vx = col * cw, vy = H - (row + 1) * ch;
    renderer.setViewport(vx, vy, cw, ch); renderer.setScissor(vx + 1, vy + 1, cw - 2, ch - 2);
    const span = c.span || 3.1, a = cw / ch; const cm = new THREE.OrthographicCamera(-span / 2 * a, span / 2 * a, span / 2, -span / 2, -100, 200);
    const d = { front: [0.9, 0.9, 1.6], face: [0.5, 0.25, 1.6], back: [-0.9, 0.9, -1.6], top: [0.0001, 1, 0.0001], side: [1.6, 0.7, 0.3] }[q.get('cam') || (view === 'cas' ? 'face' : 'front')];
    cm.position.set(c.x + d[0] * 20, d[1] * 20, c.z + d[2] * 20); cm.lookAt(c.x, c.y ?? 0.8, c.z + (c.y ? 0 : 0.2));
    renderer.render(scene, cm);
  });
} else renderer.render(scene, cam);
hud.textContent = `view=${view}`;
window.__stats = stats; window.__ready = true;
</script>
</body>
</html>
