idth="186.4" height="22" rx="4" class="ad-note"/><text x="330.0" y="169.0" text-anchor="middle" class="ad-t2">multiplier ×1, 1.7 s grace</text><path d="M330.0 194.0 h26 v14 h-26" class="ad-ln" fill="none" marker-end="url(#seq-crash-ah2)"/><text x="362.0" y="204.0" class="ad-lb2">shields = 0 → crash</text><line x1="330.0" y1="234.0" x2="592.0" y2="234.0" class="ad-ln" marker-end="url(#seq-crash-ah2)"/><text x="462.0" y="229.0" text-anchor="middle" class="ad-lb2">record, distance</text><line x1="330.0" y1="268.0" x2="724.0" y2="268.0" class="ad-ln" marker-end="url(#seq-crash-ah2)"/><text x="528.0" y="263.0" text-anchor="middle" class="ad-lb2">after 1.3 s</text><line x1="726.0" y1="302.0" x2="200.0" y2="302.0" class="ad-ln ad-ds" marker-end="url(#seq-crash-ah2)"/><text x="462.0" y="297.0" text-anchor="middle" class="ad-lb2">Again / Menu</text></svg>