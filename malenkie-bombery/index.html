<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Маленькие бомберы</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;700;900&family=Onest:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1020;
    --ink: #eef3ff;
    --dim: #8c99b8;
    --acc: #ffc845;
    --ok: #5ee08a;
    --blue: #6fb6ff;
    --danger: #ff5d6c;
    --panel: rgba(14, 20, 40, 0.82);
    --line: rgba(255, 255, 255, 0.14);
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  :root { --pad: clamp(104px, min(36vw, 19dvh), 156px); }
  @media (orientation: landscape) { :root { --pad: clamp(92px, 34dvh, 140px); } }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Onest, 'Noto Sans Thai', 'Noto Sans Georgian', system-ui, -apple-system, sans-serif; font-size: 14px;
    overflow: hidden; user-select: none; -webkit-user-select: none;
    display: flex; flex-direction: column;
    height: 100dvh; overscroll-behavior: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .i { width: 18px; height: 18px; flex: none; }
  .t { font-family: Tektur, "Arial Narrow", 'Noto Sans Thai', 'Noto Sans Georgian', system-ui, sans-serif; }
  button { font: inherit; color: inherit; }

  /* верхняя и нижняя панели */
  .bar { flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); min-height: 56px; }
  .bar .sp { flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 11px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); font: 700 14px Tektur, 'Noto Sans Thai', 'Noto Sans Georgian', system-ui, sans-serif;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chip.acc { color: var(--acc); }
  .chip.red { color: var(--danger); border-color: rgba(255, 93, 108, .5); }
  .chip.ok { color: var(--ok); border-color: rgba(94, 224, 138, .45); }
  .chip.bump { animation: bump .3s ease-out; }
  @keyframes bump { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; }
  .icon-btn:hover { border-color: rgba(255, 255, 255, .35); }
  .icon-btn:focus-visible, .btn:focus-visible, .tool:focus-visible, .lv:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  #stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 0 8px; position: relative; }
  #cv { display: block; border-radius: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, .5); touch-action: none; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 46px; padding: 0 18px; border-radius: 12px; border: 0; cursor: pointer;
    background: var(--acc); color: #1d1404; font: 700 16px Tektur, 'Noto Sans Thai', 'Noto Sans Georgian', system-ui, sans-serif; letter-spacing: .03em;
    transition: transform .1s; }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
  .btn.sm { height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
  .btn:disabled { opacity: .4; cursor: default; transform: none; }
  .btn.danger { background: var(--danger); color: #fff; }
  kbd { font: 700 11px Tektur, 'Noto Sans Thai', 'Noto Sans Georgian', system-ui, sans-serif; padding: 2px 6px; border-radius: 5px;
    background: rgba(0, 0, 0, .15); border: 1px solid rgba(0, 0, 0, .25); }

  /* экраны поверх поля */
  .scr { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: rgba(8, 12, 26, .72); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); overflow: auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px;
    width: min(460px, 100%); display: flex; flex-direction: column; gap: 14px; margin: auto; }
  .panel.wide { width: min(640px, 100%); }
  .head { display: flex; align-items: center; gap: 10px; }
  .head h2 { margin: 0; font: 900 22px Tektur, 'Noto Sans Thai', 'Noto Sans Georgian', system-ui, sans-serif; flex: 1; }
  .logo { font: 900 clamp(34px, 8vw, 52px)/1 Tektur, 'Noto Sans Thai', 'Noto Sans Georgian', system-ui, sans-serif; text-align: center; margin: 4px 0 0;
    color: var(--acc); text-shadow: 0 4px 0 #9a5b00, 0 0 30px rgba(255, 200, 69, .35); }
  .sub { text-align: center; color: var(--dim); margin: -4px 0 0; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row.c { justify-content: center; }
  .meter { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font: 700 13px Tektur, 'Noto Sans Thai', 'Noto Sans Georgian', system-ui, sans-serif; }
  .track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, .08); overflow: hidden; }
  .track > i { display: block; height: 100%; background: var(--acc); border-radius: inherit; transition: width .4s; }
  .track.ok > i { background: var(--ok); }

  /* карта уровней */
  .world { display: grid; grid-template-columns: 28px repeat(5, 1fr); gap: 8px; align-items: center; }
  .world .wi { display: grid; place-items: center; }
  .lv { aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .05);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; padding: 0;
    font: 900 20px Tektur, 'Noto Sans Thai', 'Noto Sans Georgian', system-ui, sans-serif; }
  .lv:hover:not(:disabled) { border-color: var(--acc); }
  .lv:disabled { cursor: default; opacity: .45; }
  .lv.cur { border-color: var(--acc); box-shadow: 0 0 0 2px rgba(255, 200, 69, .35); }
  .stars { display: flex; gap: 1px; color: rgba(255, 255, 255, .2); }
  .stars .on { color: var(--acc); }
  .stars .i { width: 13px; height: 13px; }
  .bigstars .i { width: 44px; height: 44px; }
  .bigstars { justify-content: center; gap: 6px; }
  .bigstars .on { animation: pop .4s ease-out backwards; }
  .bigstars .on:nth-child(2) { animation-delay: .15s; }
  .bigstars .on:nth-child(3) { animation-delay: .3s; }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }

  /* мои уровни */
  .mine { display: flex; flex-direction: column; gap: 8px; max-height: calc(100dvh - 150px); overflow: auto; }
  .mi { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 12px; background: rgba(255, 255, 255, .05);
    border: 1px solid var(--line); }
  .mi canvas { width: 60px; height: 52px; border-radius: 6px; flex: none; }
  .mi .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .mi .nm b { font: 700 15px Tektur, 'Noto Sans Thai', 'Noto Sans Georgian', system-ui, sans-serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mi .nm small { color: var(--dim); display: flex; gap: 10px; }
  .mi .nm small span { display: inline-flex; gap: 3px; align-items: center; }
  .mi .nm small .i { width: 13px; height: 13px; }
  .empty { text-align: center; color: var(--dim); padding: 18px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .empty .i { width: 34px; height: 34px; opacity: .5; }

  /* редактор */
  #edPal { flex: none; display: flex; gap: 6px; padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    overflow-x: auto; justify-content: center; flex-wrap: wrap; }
  .tool { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 6px 4px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line); cursor: pointer; font: 600 11px Onest, system-ui, sans-serif; min-width: 58px; }
  .tool canvas { width: 32px; height: 32px; border-radius: 4px; }
  .tool.on { border-color: var(--acc); background: rgba(255, 200, 69, .14); color: var(--acc); }
  .tool kbd { font-size: 9px; padding: 0 4px; background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .15); }
  #edName { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 0 12px; font: 700 15px Tektur, 'Noto Sans Thai', 'Noto Sans Georgian', system-ui, sans-serif; width: 180px; min-width: 0; }
  #edName:focus { outline: 2px solid var(--acc); outline-offset: 0; }
  textarea { width: 100%; height: 110px; resize: none; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(0, 0, 0, .3); color: var(--ink); padding: 10px; font: 12px ui-monospace, Menlo, monospace; user-select: text; }

  /* итоги */
  .res { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .res .card { background: rgba(255, 255, 255, .05); border: 1px solid var(--line); border-radius: 12px; padding: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .res .card b { font: 900 22px Tektur, 'Noto Sans Thai', 'Noto Sans Georgian', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .res .card small { color: var(--dim); display: flex; gap: 4px; align-items: center; }
  .res .card small .i { width: 13px; height: 13px; }
  .bigico { display: grid; place-items: center; }
  .bigico .i { width: 56px; height: 56px; }

  /* касания */
  /* управление пальцами: в портрете — полоса под полем, в ландшафте — по бокам поверх краёв экрана */
  #touch { flex: none; position: relative; z-index: 4; pointer-events: none;
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px max(18px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); }
  @media (orientation: landscape) { #touch { position: fixed; left: 0; right: 0; bottom: 0; align-items: flex-end;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); } }
  #pad { pointer-events: auto; width: var(--pad); height: var(--pad); border-radius: 50%; position: relative; touch-action: none;
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .2); }
  #pad::before, #pad::after { content: ""; position: absolute; background: rgba(255, 255, 255, .12); border-radius: 8px; }
  #pad::before { left: 50%; top: 12%; bottom: 12%; width: 27%; transform: translateX(-50%); }
  #pad::after { top: 50%; left: 12%; right: 12%; height: 27%; transform: translateY(-50%); }
  #knob { position: absolute; left: 50%; top: 50%; width: calc(var(--pad) * .3); height: calc(var(--pad) * .3);
    margin: calc(var(--pad) * -.15) 0 0 calc(var(--pad) * -.15); border-radius: 50%;
    background: rgba(255, 255, 255, .35); z-index: 1; pointer-events: none; }
  #bombBtn { pointer-events: auto; width: calc(var(--pad) * .68); height: calc(var(--pad) * .68); border-radius: 50%; border: 0; touch-action: none;
    background: var(--acc); color: #1d1404; display: grid; place-items: center; box-shadow: 0 6px 0 #9a5b00; }
  #bombBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #9a5b00; }
  #bombBtn .i { width: 46%; height: 46%; }

  .lg { justify-content: flex-start; } .lg.on { border-color: var(--acc); color: var(--acc); }
  #toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 9; pointer-events: none;
    background: var(--ok); color: #062512; font: 700 14px Tektur, 'Noto Sans Thai', 'Noto Sans Georgian', system-ui, sans-serif; padding: 8px 14px; border-radius: 999px;
    display: flex; gap: 6px; align-items: center; opacity: 0; transition: opacity .25s; }
  #toast.on { opacity: 1; }
  #toast.bad { background: var(--danger); color: #fff; }

  #mapGrid { max-height: calc(100dvh - 140px); overflow: auto; }
  #mapGrid .world { grid-template-columns: 28px repeat(5, minmax(0, 64px)); justify-content: center; gap: 6px; }
  /* награды */
  .ach { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: calc(100dvh - 150px); overflow: auto; }
  .ai { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 12px; background: rgba(255, 255, 255, .05);
    border: 1px solid var(--line); opacity: .7; }
  .ai.got { opacity: 1; border-color: rgba(255, 200, 69, .5); }
  .ai .ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex: none;
    background: rgba(255, 255, 255, .06); color: var(--dim); }
  .ai.got .ic { background: rgba(255, 200, 69, .16); color: var(--acc); }
  .ai .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .ai b { font: 700 14px Tektur, 'Noto Sans Thai', 'Noto Sans Georgian', system-ui, sans-serif; }
  .ai small { color: var(--dim); font-size: 12px; line-height: 1.25; }
  .ai .track { height: 6px; }
  @media (pointer: fine) { #touch { display: none !important; } }
  @media (pointer: coarse) { .hint { display: none !important; } }
  @media (max-width: 560px) {
    .bar { gap: 6px; padding-left: 8px; padding-right: 8px; }
    .chip { height: 30px; padding: 0 8px; font-size: 13px; gap: 4px; }
    .chip .i { width: 15px; height: 15px; }
    .hide-s { display: none !important; }
    #edName { width: 120px; }
    .ach { grid-template-columns: 1fr; }
    .bar { padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  }
  @media (max-width: 400px) {
    .bar { gap: 4px; min-height: 48px; }
    .bar .icon-btn { width: 34px; height: 34px; }
    .chip { height: 28px; padding: 0 6px; font-size: 12px; gap: 3px; }
    .chip .i { width: 14px; height: 14px; }
    .lv { font-size: 16px; border-radius: 9px; }
    .stars .i { width: 10px; height: 10px; }
    .panel { padding: 14px; }
    .logo { font-size: 30px; }
    .btn.sm { padding: 0 4px; font-size: 12px; gap: 4px; min-width: 0; }
    .btn.sm .i { width: 15px; height: 15px; }
    .panel .row > .btn { min-width: 0; }
  }
  /* низкие экраны (телефон на боку): меню и итоги компактнее */
  @media (max-height: 460px) {
    .panel { padding: 12px 16px; gap: 8px; }
    .logo { font-size: 28px; margin: 0; } .logo br { display: none; } .sub { display: none; }
    .btn { height: 40px; font-size: 15px; } .btn.sm { height: 34px; }
    .hint { display: none !important; }
    .bigstars .i { width: 30px; height: 30px; } .bigico .i { width: 36px; height: 36px; }
    .res .card { padding: 6px; } .res .card b { font-size: 18px; }
    .head h2 { font-size: 18px; }
    #mapGrid, .ach, .mine { max-height: calc(100dvh - 90px); }
    .lv { aspect-ratio: auto; height: 46px; }
    #edBar .hide-s { display: none !important; }
    #edPal { flex-wrap: nowrap; justify-content: flex-start; padding: 4px max(12px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)); }
    .tool { min-width: 42px; padding: 3px; } .tool span { display: none; } .tool canvas { width: 28px; height: 28px; }
  }
  @media (pointer: coarse) { .tool kbd { display: none; } }
</style>
</head>

function encode(name, theme, rows) { return 'MB1:' + btoa(unescape(encodeURIComponent(JSON.stringify({ n: name, t: theme, r: rows.join('') })))); }
function decode(s) {

  const o = JSON.parse(decodeURIComponent(escape(atob(s.slice(4)))));
  if (typeof o.r !== 'string' || o.r.length !== W * H || !VALID.test(o.r)) throw 0;
  const rows = []; for (let y = 0; y < H; y++) rows.push(o.r.slice(y * W, y * W + W));
  return { name: String(o.n || '').slice(0, 28), theme: Math.max(0, Math.min(THEMES.length - 1, o.t | 0)), rows };
}
function encodeSave() { const { done, unlocked, custom, ach, stats, kit } = save; return 'MBS1:' + btoa(unescape(encodeURIComponent(JSON.stringify({ done, unlocked, custom, ach, stats, kit })))); }
// вставленный прогресс не затирает текущий, а объединяется с ним: лучшие звёзды и время, больше счётчики
function mergeSave(code) {
  const o = JSON.parse(decodeURIComponent(escape(atob(code.trim().slice(5)))));
  if (!o || typeof o !== 'object') throw 0;
  for (const k in (o.done || {})) { const n = o.done[k], d = save.done[k]; if (!(+k >= 0 && +k < CAMP.length) || !n) continue;
    save.done[k] = d ? { stars: Math.max(d.stars, n.stars | 0), best: Math.min(d.best ?? Infinity, n.best ?? Infinity) } : { stars: n.stars | 0, best: n.best ?? null }; }
  save.unlocked = Math.max(save.unlocked, Math.min(CAMP.length - 1, o.unlocked | 0));
  for (const k in (o.done || {})) save.unlocked = Math.max(save.unlocked, Math.min(CAMP.length - 1, +k + 1));
  for (const c of (o.custom || [])) if (c && c.id && Array.isArray(c.rows) && c.rows.length === H && c.rows.every((r) => typeof r === 'string' && r.length === W && VALID.test(r)) && !save.custom.some((x) => x.id === c.id))
    save.custom.push({ id: String(c.id), name: String(c.name || '').slice(0, 28), theme: Math.max(0, Math.min(THEMES.length - 1, c.theme | 0)), rows: c.rows, best: c.best ?? null });
  for (const k in (o.ach || {})) if (ACH.some((a) => a.id === k)) save.ach[k] = Math.min(save.ach[k] || Infinity, +o.ach[k] || Date.now());
  for (const k in (o.stats || {})) if (typeof o.stats[k] === 'number' && k !== 'streak') save.stats[k] = Math.max(save.stats[k] || 0, o.stats[k]);
  for (const k in (o.kit || {})) { const n = o.kit[k]; if (!(+k >= 0 && +k < CAMP.length) || !Array.isArray(n)) continue; const d = save.kit[k] || [1, 2, 0];
    save.kit[k] = [Math.max(d[0], Math.min(8, n[0] | 0)), Math.max(d[1], Math.min(9, n[1] | 0)), Math.max(d[2], Math.min(3, n[2] | 0))]; }
  checkAch(); persist();
}
function openCode(code, title) { $('cTitle').textContent = tr(title || 'Код уровня'); $('cTxt').value = code; $('oCode').hidden = false; $('cCopy').hidden = !code; if (!code) $('cTxt').focus(); else $('cTxt').select(); }
$('cClose').onclick = () => { $('oCode').hidden = true; };
$('cCopy').onclick = async () => { try { await navigator.clipboard.writeText($('cTxt').value); toast(tr('Скопировано')); } catch (e) { $('cTxt').select(); document.execCommand('copy'); toast(tr('Скопировано')); } };
$('cLoad').onclick = () => {
  if ($('cTxt').value.trim().startsWith('MBS1:')) {
    try { mergeSave($('cTxt').value); $('oCode').hidden = true; toast(tr('Прогресс объединён')); fillMenu(); if (screen !== 'menu') show('menu'); }
    catch (e) { toast(tr('Код не подошёл'), true); }
    return;
  }
  try { const L = decode($('cTxt').value); const id = Date.now().toString(36);
    save.custom.push({ id, name: L.name || tr('Из кода'), theme: L.theme, rows: L.rows, best: null }); persist();
    $('oCode').hidden = true; toast(tr('Добавлено')); if (screen === 'mine') fillMine(); else show('mine');
  } catch (e) { toast(tr('Код не подошёл'), true); }
};

let toastT = 0;
function toast(msg, bad = false, ms = 1500, ico) { const el = $('toast'); el.querySelector('span').textContent = msg; el.classList.toggle('bad', bad);
  el.querySelector('use').setAttribute('href', bad ? '#i-x' : (ico || '#i-check')); el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), ms); }

/* ============================ РАЗМЕР И ЦИКЛ ============================ */
function fit() {
  const st = $('stage'); const touch = screen === 'game' && matchMedia('(pointer: coarse)').matches;
  // в ландшафте джойстик и кнопка бомбы лежат по бокам: поле помещается между ними
  let side = 0;
  if (touch && innerWidth > innerHeight) { const a = $('pad').getBoundingClientRect(), b = $('bombBtn').getBoundingClientRect(); side = 2 * Math.max(a.right, innerWidth - b.left) + 8; }
  const aw = st.clientWidth - 16 - Math.max(0, side - 16), ah = st.clientHeight - 16;
  const k = Math.max(0.1, Math.min(aw / cv.width, ah / cv.height));
  cv.style.width = Math.floor(cv.width * k) + 'px'; cv.style.height = Math.floor(cv.height * k) + 'px';
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 150));
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  edClock += dt;
  if (screen !== 'editor') update(dt);
  render(); updHud();
  requestAnimationFrame(frame);
}
applyLang();
show('menu');
requestAnimationFrame(frame);
// для проверок из консоли
window.__mb = { get G() { return G; }, get screen() { return screen; }, get save() { return save; }, step: (dt) => update(dt) };
})();
</script>
