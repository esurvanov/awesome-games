<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Маленькие бомберы</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;700;900&family=Onest:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1020;
    --ink: #eef3ff;
    --dim: #8c99b8;
    --acc: #ffc845;
    --ok: #5ee08a;
    --blue: #6fb6ff;
    --danger: #ff5d6c;
    --panel: rgba(14, 20, 40, 0.82);
    --line: rgba(255, 255, 255, 0.14);
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Onest, system-ui, -apple-system, sans-serif; font-size: 14px;
    overflow: hidden; user-select: none; -webkit-user-select: none;
    display: flex; flex-direction: column;
  }
  .i { width: 18px; height: 18px; flex: none; }
  .t { font-family: Tektur, "Arial Narrow", system-ui, sans-serif; }
  button { font: inherit; color: inherit; }

  /* верхняя и нижняя панели */
  .bar { flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px; min-height: 56px; }
  .bar .sp { flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 11px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); font: 700 14px Tektur, system-ui, sans-serif;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chip.acc { color: var(--acc); }
  .chip.red { color: var(--danger); border-color: rgba(255, 93, 108, .5); }
  .chip.ok { color: var(--ok); border-color: rgba(94, 224, 138, .45); }
  .chip.bump { animation: bump .3s ease-out; }
  @keyframes bump { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; }
  .icon-btn:hover { border-color: rgba(255, 255, 255, .35); }
  .icon-btn:focus-visible, .btn:focus-visible, .tool:focus-visible, .lv:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  #stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 0 8px; position: relative; }
  #cv { display: block; border-radius: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, .5); touch-action: none; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 46px; padding: 0 18px; border-radius: 12px; border: 0; cursor: pointer;
    background: var(--acc); color: #1d1404; font: 700 16px Tektur, system-ui, sans-serif; letter-spacing: .03em;
    transition: transform .1s; }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
  .btn.sm { height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
  .btn:disabled { opacity: .4; cursor: default; transform: none; }
  .btn.danger { background: var(--danger); color: #fff; }
  kbd { font: 700 11px Tektur, system-ui, sans-serif; padding: 2px 6px; border-radius: 5px;
    background: rgba(0, 0, 0, .15); border: 1px solid rgba(0, 0, 0, .25); }

  /* экраны поверх поля */
  .scr { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 16px;
    background: rgba(8, 12, 26, .72); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); overflow: auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px;
    width: min(460px, 100%); display: flex; flex-direction: column; gap: 14px; }
  .panel.wide { width: min(640px, 100%); }
  .head { display: flex; align-items: center; gap: 10px; }
  .head h2 { margin: 0; font: 900 22px Tektur, system-ui, sans-serif; flex: 1; }
  .logo { font: 900 clamp(34px, 8vw, 52px)/1 Tektur, system-ui, sans-serif; text-align: center; margin: 4px 0 0;
    color: var(--acc); text-shadow: 0 4px 0 #9a5b00, 0 0 30px rgba(255, 200, 69, .35); }
  .sub { text-align: center; color: var(--dim); margin: -4px 0 0; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row.c { justify-content: center; }
  .meter { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font: 700 13px Tektur, system-ui, sans-serif; }
  .track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, .08); overflow: hidden; }
  .track > i { display: block; height: 100%; background: var(--acc); border-radius: inherit; transition: width .4s; }
  .track.ok > i { background: var(--ok); }

  /* карта уровней */
  .world { display: grid; grid-template-columns: 28px repeat(5, 1fr); gap: 8px; align-items: center; }
  .world .wi { display: grid; place-items: center; }
  .lv { aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .05);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; padding: 0;
    font: 900 20px Tektur, system-ui, sans-serif; }
  .lv:hover:not(:disabled) { border-color: var(--acc); }
  .lv:disabled { cursor: default; opacity: .45; }
  .lv.cur { border-color: var(--acc); box-shadow: 0 0 0 2px rgba(255, 200, 69, .35); }
  .stars { display: flex; gap: 1px; color: rgba(255, 255, 255, .2); }
  .stars .on { color: var(--acc); }
  .stars .i { width: 13px; height: 13px; }
  .bigstars .i { width: 44px; height: 44px; }
  .bigstars { justify-content: center; gap: 6px; }
  .bigstars .on { animation: pop .4s ease-out backwards; }
  .bigstars .on:nth-child(2) { animation-delay: .15s; }
  .bigstars .on:nth-child(3) { animation-delay: .3s; }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }

  /* мои уровни */
  .mine { display: flex; flex-direction: column; gap: 8px; max-height: 52vh; overflow: auto; }
  .mi { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 12px; background: rgba(255, 255, 255, .05);
    border: 1px solid var(--line); }
  .mi canvas { width: 60px; height: 52px; border-radius: 6px; flex: none; }
  .mi .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .mi .nm b { font: 700 15px Tektur, system-ui, sans-serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mi .nm small { color: var(--dim); display: flex; gap: 10px; }
  .mi .nm small span { display: inline-flex; gap: 3px; align-items: center; }
  .mi .nm small .i { width: 13px; height: 13px; }
  .empty { text-align: center; color: var(--dim); padding: 18px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .empty .i { width: 34px; height: 34px; opacity: .5; }

  /* редактор */
  #edPal { flex: none; display: flex; gap: 6px; padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    overflow-x: auto; justify-content: center; flex-wrap: wrap; }
  .tool { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 6px 4px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line); cursor: pointer; font: 600 11px Onest, system-ui, sans-serif; min-width: 58px; }
  .tool canvas { width: 32px; height: 32px; border-radius: 4px; }
  .tool.on { border-color: var(--acc); background: rgba(255, 200, 69, .14); color: var(--acc); }
  .tool kbd { font-size: 9px; padding: 0 4px; background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .15); }
  #edName { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 0 12px; font: 700 15px Tektur, system-ui, sans-serif; width: 180px; min-width: 0; }
  #edName:focus { outline: 2px solid var(--acc); outline-offset: 0; }
  textarea { width: 100%; height: 110px; resize: none; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(0, 0, 0, .3); color: var(--ink); padding: 10px; font: 12px ui-monospace, Menlo, monospace; user-select: text; }

  /* итоги */
  .res { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .res .card { background: rgba(255, 255, 255, .05); border: 1px solid var(--line); border-radius: 12px; padding: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .res .card b { font: 900 22px Tektur, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .res .card small { color: var(--dim); display: flex; gap: 4px; align-items: center; }
  .res .card small .i { width: 13px; height: 13px; }
  .bigico { display: grid; place-items: center; }
  .bigico .i { width: 56px; height: 56px; }

  /* касания */
  #touch { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 0 18px calc(18px + env(safe-area-inset-bottom, 0px)); }
  #pad { pointer-events: auto; width: 150px; height: 150px; border-radius: 50%; position: relative; touch-action: none;
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .2); }
  #pad::before, #pad::after { content: ""; position: absolute; background: rgba(255, 255, 255, .12); border-radius: 8px; }
  #pad::before { left: 50%; top: 18px; bottom: 18px; width: 40px; transform: translateX(-50%); }
  #pad::after { top: 50%; left: 18px; right: 18px; height: 40px; transform: translateY(-50%); }
  #knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
    background: rgba(255, 255, 255, .35); z-index: 1; pointer-events: none; }
  #bombBtn { pointer-events: auto; width: 96px; height: 96px; border-radius: 50%; border: 0; touch-action: none;
    background: var(--acc); color: #1d1404; display: grid; place-items: center; box-shadow: 0 6px 0 #9a5b00; }
  #bombBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #9a5b00; }
  #bombBtn .i { width: 44px; height: 44px; }

  #toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 9; pointer-events: none;
    background: var(--ok); color: #062512; font: 700 14px Tektur, system-ui, sans-serif; padding: 8px 14px; border-radius: 999px;
    display: flex; gap: 6px; align-items: center; opacity: 0; transition: opacity .25s; }
  #toast.on { opacity: 1; }
  #toast.bad { background: var(--danger); color: #fff; }

  @media (pointer: fine) { #touch { display: none !important; } }
  @media (max-width: 560px) {
    .bar { gap: 6px; padding-left: 8px; padding-right: 8px; }
    .chip { height: 30px; padding: 0 8px; font-size: 13px; gap: 4px; }
    .chip .i { width: 15px; height: 15px; }
    .hide-s { display: none !important; }
    #edName { width: 120px; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-brick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9.5h18M3 14.5h18M9 4v5.5M15 9.5v5M9 14.5V20"/></symbol>

    <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 2.5c1 3.5 5.5 5.5 5.5 11a5.5 5.5 0 0 1-11 0c0-2.8 1.6-4.3 2.6-5.5.3 1.6 1 2.6 2 3 0-3.3.2-5.8.9-8.5z" fill="currentColor"/></symbol>
    <symbol id="i-speed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6l6 6-6 6M13 6l6 6-6 6"/></symbol>

    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4.5a3 3 0 0 0 3.5 4M16 6h3.5a3 3 0 0 1-3.5 4M12 13v4M8 20h8"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></symbol>

    <symbol id="i-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h4L13 5v14l-5-4.5H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.6-1 1-2-.7-1.2 0-2.5 1.5-2.5H17a4 4 0 0 0 4-4C21 7 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10.5" cy="7.5" r="1.2" fill="currentColor"/><circle cx="15" cy="7.5" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-skull" viewBox="0 0 24 24"><path d="M12 3a8 8 0 0 0-8 8c0 2.6 1.2 4.4 3 5.5V20h10v-3.5c1.8-1.1 3-2.9 3-5.5a8 8 0 0 0-8-8z" fill="currentColor"/><circle cx="9" cy="11.5" r="2" fill="#0b1020"/><circle cx="15" cy="11.5" r="2" fill="#0b1020"/></symbol>
  </defs>
</svg>

<!-- игровая панель -->
<header class="bar" id="hud" hidden>
  <button class="icon-btn" id="hPause" title="Пауза (Esc)"><svg class="i"><use href="#i-pause"/></svg></button>
  <span class="chip acc t" id="hLv">1-1</span>
  <span class="sp"></span>
  <span class="chip" id="hEn" title="Враги"><svg class="i"><use href="#i-enemy"/></svg><b>0</b></span>
  <span class="chip" id="hTime" title="Время"><svg class="i"><use href="#i-clock"/></svg><b>0</b></span>
  <span class="chip" id="hB" title="Бомбы"><svg class="i"><use href="#i-bomb"/></svg><b>1</b></span>
  <span class="chip" id="hF" title="Огонь"><svg class="i"><use href="#i-fire"/></svg><b>2</b></span>
  <span class="chip hide-s" id="hS" title="Скорость"><svg class="i"><use href="#i-speed"/></svg><b>0</b></span>
</header>

<!-- панель редактора -->
<header class="bar" id="edBar" hidden>
  <button class="icon-btn" id="eBack" title="Назад"><svg class="i"><use href="#i-back"/></svg></button>
  <input id="edName" maxlength="28" placeholder="Название" aria-label="Название уровня">
  <button class="icon-btn" id="eTheme" title="Мир: луг, дюны, лёд"><svg class="i"><use href="#i-palette"/></svg></button>
  <span class="chip" id="eS" title="Старт"><svg class="i"><use href="#i-play"/></svg><b>✓</b></span>
  <span class="chip" id="eE" title="Выход"><svg class="i"><use href="#i-next"/></svg><b>✓</b></span>
  <span class="chip" id="eN" title="Враги"><svg class="i"><use href="#i-enemy"/></svg><b>0</b></span>
  <span class="sp"></span>
  <button class="icon-btn" id="eCode" title="Код уровня"><svg class="i"><use href="#i-code"/></svg></button>
  <button class="btn sm ghost" id="eTest"><svg class="i"><use href="#i-play"/></svg><span class="hide-s">Проверить</span></button>
  <button class="btn sm" id="eSave"><svg class="i"><use href="#i-save"/></svg><span class="hide-s">Сохранить</span></button>
</header>

<main id="stage"><canvas id="cv"></canvas></main>
<nav id="edPal" hidden></nav>

<div id="touch" hidden>
  <div id="pad"><div id="knob"></div></div>
  <button id="bombBtn" aria-label="Бомба"><svg class="i"><use href="#i-bomb"/></svg></button>
</div>

<!-- меню -->
<section class="scr" id="sMenu">
  <div class="panel">
    <h1 class="logo">Маленькие<br>бомберы</h1>
    <p class="sub">Взорви всех — найди выход</p>
    <div class="col">
      <div class="meter"><svg class="i"><use href="#i-trophy"/></svg><div class="track ok"><i id="mLv"></i></div><span id="mLvT">0/15</span></div>
      <div class="meter"><svg class="i" style="color:var(--acc)"><use href="#i-star"/></svg><div class="track"><i id="mSt"></i></div><span id="mStT">0/45</span></div>

// враги (m — слизень, v — летун, g — призрак), плотность ящиков, бонусы под ящиками (B бомба, F огонь, P скорость), время на 3★

];

  drawLevelBase(G.grid, G.theme, G.burn);
  const alive = G.enemies.some((e) => e.alive);
  if (G.exitAt >= 0) drawExit((G.exitAt % W) * T + T / 2, ((G.exitAt / W) | 0) * T + T / 2, !alive, t);
  for (const [i, ty] of G.items) drawItem(ty, (i % W) * T + T / 2, ((i / W) | 0) * T + T / 2, t + i);
  for (const b of G.bombs) drawBomb(b.x * T + T / 2, b.y * T + T / 2, t, b.t);
  for (let i = 0; i < W * H; i++) if (G.flame[i] > 0) drawFlameCell(i % W, (i / W) | 0, G.fdir[i], G.flame[i]);
  // по глубине: сверху вниз
  const actors = G.enemies.slice(); if (G.p && (G.p.alive || G.state === 'dying')) actors.push(G.p);
  actors.sort((a, b) => a.y - b.y);
  for (const a of actors) {
    if (a === G.p) {
      if (a.alive) drawPlayer(a, t); else { const k = Math.max(0, G.endT / 1.3); drawPlayer(a, t, 0.6 + k * 0.4, k); }
    } else drawEnemy(a, t);
  }
  for (const q of G.parts) { ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.fillStyle = q.c; ctx.fillRect(q.x * T + T / 2 - q.s / 2, q.y * T + T / 2 - q.s / 2, q.s, q.s); }
  ctx.globalAlpha = 1;
  if (G.state === 'play' && !G.attract && G.limit - G.time < 20) { ctx.fillStyle = `rgba(255,60,80,${0.08 + 0.06 * Math.sin(t * 8)})`; ctx.fillRect(0, 0, cv.width, cv.height); }
  ctx.restore();
}

/* ============================ ПАНЕЛЬ ИГРЫ ============================ */
const hudLast = {};
function setChip(id, v, cls) {
  const key = v + '|' + (cls || ''); if (hudLast[id] === key) return; hudLast[id] = key;
  const el = $(id); el.querySelector('b').textContent = v; el.classList.toggle('red', cls === 'red'); el.classList.toggle('ok', cls === 'ok');
}
function bump(id) { const el = $(id); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function updHud() {
  if (!G || G.attract || screen !== 'game') return;
  const n = G.enemies.filter((e) => e.alive).length, left = Math.max(0, G.limit - G.time);
  setChip('hEn', n, n === 0 ? 'ok' : ''); setChip('hTime', fmt(left), left < 20 ? 'red' : '');
  setChip('hB', G.p.maxB); setChip('hF', G.p.fire); setChip('hS', G.p.spd);
}

/* ============================ ЭКРАНЫ ============================ */
let screen = 'menu';
const SCREENS = ['sMenu', 'sMap', 'sMine'], OVERLAYS = ['oPause', 'oWin', 'oLose', 'oCode'];
function show(name) {
  screen = name;
  for (const s of SCREENS) $(s).hidden = s !== { menu: 'sMenu', map: 'sMap', mine: 'sMine' }[name];
  for (const o of OVERLAYS) $(o).hidden = true;
  $('hud').hidden = name !== 'game'; $('edBar').hidden = $('edPal').hidden = name !== 'editor';
  $('touch').hidden = name !== 'game';
  held.length = 0; padEnd();
  if (name !== 'game' && name !== 'editor' && (!G || !G.attract)) G = newGame(campSrc(Math.min(save.unlocked, 14)), true);
  if (name === 'menu') fillMenu(); if (name === 'map') fillMap(); if (name === 'mine') fillMine();
  fit();
}
function totals() { let st = 0, lv = 0; for (const k in save.done) { st += save.done[k].stars; lv++; } return { st, lv }; }
function fillMenu() {
  const { st, lv } = totals();
  $('mLv').style.width = (lv / CAMP.length * 100) + '%'; $('mLvT').textContent = lv + '/' + CAMP.length;
  $('mSt').style.width = (st / (CAMP.length * 3) * 100) + '%'; $('mStT').textContent = st + '/' + CAMP.length * 3;
  $('bPlayT').textContent = lv ? tr('Продолжить') + ' ' + campName(nextLevel()) : tr('Играть');
  $('bSound').querySelector('use').setAttribute('href', save.sound ? '#i-sound' : '#i-mute');
}
function nextLevel() { for (let i = 0; i <= save.unlocked; i++) if (!save.done[i]) return i; return save.unlocked; }
const starsHtml = (n, cls = 'stars') => `<span class="row ${cls}">${[0, 1, 2].map((k) => `<svg class="i ${k < n ? 'on' : ''}"><use href="#i-star"/></svg>`).join('')}</span>`;
function fillMap() {
  const g = $('mapGrid'); g.innerHTML = ''; const cur = nextLevel();
  $('mapSt').textContent = totals().st + '/' + CAMP.length * 3;
  for (let w = 0; w < 3; w++) {
    const row = document.createElement('div'); row.className = 'world';
    row.innerHTML = `<span class="wi" title="${tr(THEMES[w].name)}"><span style="display:block;width:22px;height:22px;border-radius:6px;background:${THEMES[w].fa};border:3px solid ${THEMES[w].wall}"></span></span>`;
    for (let k = 0; k < 5; k++) {
      const i = w * 5 + k, d = save.done[i], locked = i > save.unlocked;
      const b = document.createElement('button'); b.className = 'lv' + (i === cur ? ' cur' : ''); b.disabled = locked;
      b.innerHTML = locked ? `<svg class="i"><use href="#i-lock"/></svg>` : `${k + 1}${starsHtml(d ? d.stars : 0)}`;
      if (d) b.title = tr('Рекорд') + ' ' + fmt(d.best);
      b.onclick = () => play(campSrc(i)); row.appendChild(b);
    }
    g.appendChild(row);
  }
}
function miniMap(rows, theme) {
  const c = document.createElement('canvas'); c.width = W * 4; c.height = H * 4; const x = c.getContext('2d'), th = THEMES[theme || 0];
  for (let y = 0; y < H; y++) for (let i = 0; i < W; i++) { const ch = rows[y][i];
    x.fillStyle = ch === '#' ? th.wall : '+EBFP'.includes(ch) ? th.crate : ch === 'S' ? '#fff' : 'mvg'.includes(ch) ? '#ff5d6c' : th.fa;
    x.fillRect(i * 4, y * 4, 4, 4); }
  return c;
}
function fillMine() {
  const L = $('mineList'); L.innerHTML = '';
  if (!save.custom.length) { L.innerHTML = `<div class="empty"><svg class="i"><use href="#i-brick"/></svg>${tr('Пусто')}</div>`; return; }
  for (const c of save.custom.slice().reverse()) {
    const it = document.createElement('div'); it.className = 'mi';
    const en = c.rows.join('').replace(/[^mvg]/g, '').length;
    it.appendChild(miniMap(c.rows, c.theme));
    it.insertAdjacentHTML('beforeend', `<div class="nm"><b></b><small><span><svg class="i"><use href="#i-enemy"/></svg>${en}</span><span><svg class="i"><use href="#i-trophy"/></svg>${c.best != null ? fmt(c.best) : '—'}</span></small></div>
      <button class="btn sm" data-a="play" title="${tr('Играть')}"><svg class="i"><use href="#i-play"/></svg></button>
      <button class="icon-btn" data-a="edit" title="${tr('Изменить')}"><svg class="i"><use href="#i-edit"/></svg></button>
      <button class="icon-btn" data-a="code" title="${tr('Код')}"><svg class="i"><use href="#i-code"/></svg></button>
      <button class="icon-btn" data-a="del" title="${tr('Удалить')}"><svg class="i"><use href="#i-trash"/></svg></button>`);
    it.querySelector('b').textContent = c.name;
    it.querySelector('[data-a=play]').onclick = () => play({ kind: 'custom', id: c.id, name: c.name, theme: c.theme, rows: c.rows });
    it.querySelector('[data-a=edit]').onclick = () => openEditor({ id: c.id, name: c.name, theme: c.theme, rows: c.rows.map((r) => r.split('')) });
    it.querySelector('[data-a=code]').onclick = () => openCode(encode(c.name, c.theme, c.rows));
    const del = it.querySelector('[data-a=del]');
    del.onclick = () => {
      if (!del.classList.contains('armed')) { del.classList.add('armed'); del.style.background = 'var(--danger)'; del.title = tr('Ещё раз — удалить'); setTimeout(() => { del.classList.remove('armed'); del.style.background = ''; }, 2500); return; }
      save.custom = save.custom.filter((x) => x.id !== c.id); persist(); fillMine(); toast(tr('Удалено'));
    };
    L.appendChild(it);
  }
}

function play(src) { G = newGame(src); show('game'); $('hLv').textContent = src.name; for (const k in hudLast) delete hudLast[k];
  document.querySelectorAll('.outT').forEach((e) => e.textContent = tr(src.kind === 'test' ? 'Редактор' : 'Меню')); }
function restart() { play(G.src); }
function leave() { const s = G && G.src; if (s && s.kind === 'test') openEditor(ED); else if (s && s.kind === 'custom') show('mine'); else show(s && s.kind === 'camp' ? 'map' : 'menu'); }
function togglePause(force) {
  if (!G || G.attract) return;
  if (G.state === 'play' || force === true) { if (G.state !== 'play') return; G.state = 'paused'; $('oPause').hidden = false; held.length = 0; }
  else if (G.state === 'paused') { G.state = 'play'; $('oPause').hidden = true; }
}
function showWin() {
  const r = G.result, s = G.src;
  $('wStars').innerHTML = s.kind === 'camp' ? [0, 1, 2].map((k) => `<svg class="i ${k < r.stars ? 'on' : ''}" style="color:${k < r.stars ? 'var(--acc)' : 'rgba(255,255,255,.15)'}"><use href="#i-star"/></svg>`).join('')
    : `<span class="bigico" style="color:var(--ok)"><svg class="i"><use href="#i-trophy"/></svg></span>`;
  $('wTime').textContent = fmt(r.time); $('wBest').textContent = fmt(r.best);
  $('wBest').style.color = r.newBest ? 'var(--ok)' : '';
  $('wPar').parentElement.hidden = s.kind !== 'camp'; $('wPar').textContent = s.kind === 'camp' ? fmt(s.par) : '';
  const hasNext = s.kind === 'camp' && s.i < CAMP.length - 1;
  $('wNext').hidden = !hasNext; $('oWin').hidden = false;
}
const LOSE = { fire: ['#i-fire', 'Подорвался'], enemy: ['#i-enemy', 'Поймали'], time: ['#i-clock', 'Время вышло'] };
function showLose(why) { const [ico, txt] = LOSE[why] || LOSE.fire; $('lIco').querySelector('use').setAttribute('href', ico); $('lTxt').textContent = tr(txt); $('oLose').hidden = false; }

$('bPlay').onclick = () => play(campSrc(nextLevel()));
$('bMap').onclick = () => show('map');
$('bMine').onclick = () => show('mine');
$('bEd').onclick = () => openEditor(save.draft || null);
$('bLang').onclick = () => { LANG = LANG === 'en' ? 'ru' : 'en'; save.lang = LANG; persist(); applyLang(); fillMenu(); };
$('bSound').onclick = () => { save.sound = !save.sound; persist(); fillMenu(); if (save.sound) SFX.pick(); };
document.querySelectorAll('[data-back]').forEach((b) => b.onclick = () => show('menu'));
$('hPause').onclick = () => togglePause();
$('pRes').onclick = () => togglePause(); $('pRe').onclick = restart; $('pOut').onclick = leave;
$('wRe').onclick = restart; $('wOut').onclick = leave; $('wNext').onclick = () => play(campSrc(G.src.i + 1));
$('lRe').onclick = restart; $('lOut').onclick = leave;
$('mNew').onclick = () => openEditor(null);
$('mImp').onclick = () => openCode('');

/* ============================ РЕДАКТОР ============================ */
const TOOLS = [['.', 'Пол'], ['#', 'Стена'], ['+', 'Ящик'], ['S', 'Старт'], ['E', 'Выход'], ['m', 'Слизень'], ['v', 'Летун'], ['g', 'Призрак'], ['B', 'Бомба'], ['F', 'Огонь'], ['P', 'Скорость']];
let ED = null, edHover = null, painting = false;
const edCount = () => { const s = ED.rows.flat().join(''); return { S: (s.match(/S/g) || []).length, E: (s.match(/E/g) || []).length, n: (s.match(/[mvg]/g) || []).length }; };
function openEditor(st) {
  if (st && st.rows) ED = { id: st.id || null, name: st.name || '', theme: st.theme || 0, rows: st.rows.map((r) => (Array.isArray(r) ? r : r.split('')).slice()), tool: st.tool || '+' };
  else { const r = emptyRows(); r[1][1] = 'S'; ED = { id: null, name: '', theme: 0, rows: r, tool: '+' }; }
  show('editor'); $('edName').value = ED.name; buildPalette(); edChanged(false); fit();
}
function buildPalette() {
  const pal = $('edPal'); pal.innerHTML = '';
  TOOLS.forEach(([ch, label], n) => {
    const b = document.createElement('button'); b.className = 'tool' + (ED.tool === ch ? ' on' : ''); b.dataset.t = ch; b.title = tr(label);
    const c = document.createElement('canvas'); c.width = c.height = T; b.appendChild(c);
    b.insertAdjacentHTML('beforeend', `<span>${tr(label)}</span><kbd>${'1234567890-='[n]}</kbd>`);
    b.onclick = () => setTool(ch); pal.appendChild(b);
    drawTo(c.getContext('2d'), () => drawEdCell(0, 0, ch, THEMES[ED.theme], 0.4));
  });
}
function drawTo(c2, fn) { const keep = ctx; ctx = c2; try { fn(); } finally { ctx = keep; } }
function setTool(ch) { ED.tool = ch; document.querySelectorAll('.tool').forEach((b) => b.classList.toggle('on', b.dataset.t === ch)); }
function edChanged(store = true) {
  const c = edCount();
  const st = (id, ok, v) => { const el = $(id); el.classList.toggle('ok', ok); el.classList.toggle('red', !ok); el.querySelector('b').textContent = v; };
  st('eS', c.S === 1, c.S === 1 ? '✓' : '✗'); st('eE', c.E === 1, c.E === 1 ? '✓' : '✗'); st('eN', c.n > 0, c.n);
  const ok = c.S === 1 && c.E === 1 && c.n > 0; $('eTest').disabled = $('eSave').disabled = !ok;
  if (store) { ED.name = $('edName').value.trim(); save.draft = { id: ED.id, name: ED.name, theme: ED.theme, rows: ED.rows.map((r) => r.join('')), tool: ED.tool }; persistSoon(); }
}
let pt = 0; function persistSoon() { clearTimeout(pt); pt = setTimeout(persist, 300); }
function cellFromEvent(ev) { const r = cv.getBoundingClientRect(); const x = Math.floor((ev.clientX - r.left) / r.width * W), y = Math.floor((ev.clientY - r.top) / r.height * H); return inb(x, y) ? { x, y } : null; }
function paint(c) {
  if (!c || c.x === 0 || c.y === 0 || c.x === W - 1 || c.y === H - 1) return;
  const ch = ED.tool; if (ED.rows[c.y][c.x] === ch) return;
  if (ch === 'S' || ch === 'E') for (const r of ED.rows) for (let i = 0; i < W; i++) if (r[i] === ch) r[i] = ch === 'S' ? '.' : '+';
  ED.rows[c.y][c.x] = ch; edChanged();
}
cv.addEventListener('pointerdown', (ev) => { if (screen !== 'editor') return; painting = true; cv.setPointerCapture(ev.pointerId); paint(cellFromEvent(ev)); });
cv.addEventListener('pointermove', (ev) => { if (screen !== 'editor') return; edHover = cellFromEvent(ev); if (painting) paint(edHover); });
cv.addEventListener('pointerup', () => { painting = false; });
cv.addEventListener('pointerleave', () => { edHover = null; });
function drawEdCell(x, y, ch, th, t) {
  if (ch === '#') return drawWall(x, y, th);
  drawFloor(x, y, th);
  const cx = x * T + T / 2, cy = y * T + T / 2;
  if ('+EBFP'.includes(ch)) {
    drawCrate(x, y, th);
    if (ch === 'E') drawExit(cx, cy, true, t, 0.62);
    else if (ch !== '+') drawItem(ch, cx, cy, 0, 0.7);
  } else if (ch === 'S') drawPlayer({ x, y, fx: 0, fy: 1, moving: false, walk: 0 }, t, 0.9);
  else if ('mvg'.includes(ch)) drawEnemy({ type: ch, x, y, dx: 0, dy: 1, alive: true, die: 0, ph: 0 }, t);
}
let edClock = 0;
function renderEditor() {
  const th = THEMES[ED.theme];
  ctx.fillStyle = th.bg; ctx.fillRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) drawEdCell(x, y, ED.rows[y][x], th, edClock);
  if (edHover && !(edHover.x === 0 || edHover.y === 0 || edHover.x === W - 1 || edHover.y === H - 1)) {
    ctx.globalAlpha = 0.5; drawEdCell(edHover.x, edHover.y, ED.tool, th, edClock); ctx.globalAlpha = 1;
    ctx.strokeStyle = '#ffc845'; ctx.lineWidth = 3; ctx.strokeRect(edHover.x * T + 1.5, edHover.y * T + 1.5, T - 3, T - 3);
  }
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
  for (let x = 1; x < W; x++) { ctx.beginPath(); ctx.moveTo(x * T, 0); ctx.lineTo(x * T, H * T); ctx.stroke(); }
  for (let y = 1; y < H; y++) { ctx.beginPath(); ctx.moveTo(0, y * T); ctx.lineTo(W * T, y * T); ctx.stroke(); }
}
$('edName').addEventListener('input', () => edChanged());
$('eTheme').onclick = () => { ED.theme = (ED.theme + 1) % THEMES.length; buildPalette(); edChanged(); toast(tr(THEMES[ED.theme].name)); };
$('eBack').onclick = () => show(ED.id ? 'mine' : 'menu');
$('eTest').onclick = () => { edChanged(); play({ kind: 'test', name: ED.name || tr('Проверка'), theme: ED.theme, rows: ED.rows.map((r) => r.join('')) }); };
$('eSave').onclick = () => {
  edChanged();
  const rows = ED.rows.map((r) => r.join('')), name = ED.name || (tr('Уровень') + ' ' + (save.custom.length + 1));
  const ex = ED.id && save.custom.find((c) => c.id === ED.id);
  if (ex) { if (ex.rows.join('') !== rows.join('')) ex.best = null; Object.assign(ex, { name, theme: ED.theme, rows }); }
  else { ED.id = Date.now().toString(36); save.custom.push({ id: ED.id, name, theme: ED.theme, rows, best: null }); }
  ED.name = name; $('edName').value = name; save.draft = null; persist(); toast(tr('Сохранено'));
};
$('eCode').onclick = () => { edChanged(); openCode(encode(ED.name, ED.theme, ED.rows.map((r) => r.join('')))); };

/* код уровня: обмен без сервера */
function encode(name, theme, rows) { return 'MB1:' + btoa(unescape(encodeURIComponent(JSON.stringify({ n: name, t: theme, r: rows.join('') })))); }
function decode(s) {
  s = s.trim(); if (!s.startsWith('MB1:')) throw 0;
  const o = JSON.parse(decodeURIComponent(escape(atob(s.slice(4)))));
  if (typeof o.r !== 'string' || o.r.length !== W * H || !VALID.test(o.r)) throw 0;
  const rows = []; for (let y = 0; y < H; y++) rows.push(o.r.slice(y * W, y * W + W));
  return { name: String(o.n || '').slice(0, 28), theme: Math.max(0, Math.min(THEMES.length - 1, o.t | 0)), rows };
}
function openCode(code) { $('cTxt').value = code; $('oCode').hidden = false; $('cCopy').hidden = !code; if (!code) $('cTxt').focus(); else $('cTxt').select(); }
$('cClose').onclick = () => { $('oCode').hidden = true; };
$('cCopy').onclick = async () => { try { await navigator.clipboard.writeText($('cTxt').value); toast(tr('Скопировано')); } catch (e) { $('cTxt').select(); document.execCommand('copy'); toast(tr('Скопировано')); } };
$('cLoad').onclick = () => {
  try { const L = decode($('cTxt').value); const id = Date.now().toString(36);
    save.custom.push({ id, name: L.name || tr('Из кода'), theme: L.theme, rows: L.rows, best: null }); persist();
    $('oCode').hidden = true; toast(tr('Добавлено')); if (screen === 'mine') fillMine(); else show('mine');
  } catch (e) { toast(tr('Код не подошёл'), true); }
};

let toastT = 0;
function toast(msg, bad = false) { const el = $('toast'); el.querySelector('span').textContent = msg; el.classList.toggle('bad', bad);
  el.querySelector('use').setAttribute('href', bad ? '#i-x' : '#i-check'); el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1500); }

/* ============================ РАЗМЕР И ЦИКЛ ============================ */
function fit() {
  const st = $('stage'); const touch = screen === 'game' && matchMedia('(pointer: coarse)').matches;
  const aw = st.clientWidth - 16, ah = st.clientHeight - 16 - (touch && innerHeight > innerWidth ? 190 : 0);
  const k = Math.max(0.1, Math.min(aw / cv.width, ah / cv.height));
  cv.style.width = Math.floor(cv.width * k) + 'px'; cv.style.height = Math.floor(cv.height * k) + 'px';
}
addEventListener('resize', fit);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  edClock += dt;
  if (screen !== 'editor') update(dt);
  render(); updHud();
  requestAnimationFrame(frame);
}
applyLang();
show('menu');
requestAnimationFrame(frame);
// для проверок из консоли
window.__mb = { get G() { return G; }, get screen() { return screen; }, get save() { return save; }, step: (dt) => update(dt) };
})();
</script>
