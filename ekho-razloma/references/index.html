<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Референсы Разлома</title>
<style>
:root{--bg:#0d1320;--card:#162033;--line:#26334d;--tx:#dfe6f2;--mut:#8a97b0;--acc:#4fd18b;--warm:#e0a060;--sel:#4fd18b}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#eef2f7;--card:#fff;--line:#d5dce8;--tx:#16202e;--mut:#5d6a80;--acc:#16955a;--sel:#16955a}}
:root[data-theme="light"]{--bg:#eef2f7;--card:#fff;--line:#d5dce8;--tx:#16202e;--mut:#5d6a80;--acc:#16955a;--sel:#16955a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:16px;margin:0 8px 0 0;display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn.pri{background:var(--acc);color:#04120a;border-color:transparent;font-weight:600}
.btn:hover{filter:brightness(1.1)}
.cnt{font-variant-numeric:tabular-nums;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer;text-decoration:none}
.chip b{color:var(--tx)}
main{padding:12px 16px 40px;max-width:1500px;margin:0 auto}
section{margin:18px 0 26px}
.sh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sh h2{font-size:15px;margin:0;display:flex;gap:6px;align-items:center}
.sw{display:inline-flex;gap:4px;align-items:center;font-size:11px;color:var(--mut)}
.sw i{display:inline-block;width:18px;height:14px;border-radius:3px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card.on{border-color:var(--sel)}
.card img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;cursor:zoom-in;background:#000}
.meta{padding:6px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px}
.meta label{display:flex;gap:6px;align-items:center;cursor:pointer;flex:1 0 100%;white-space:nowrap}
.meta input{width:18px;height:18px;accent-color:var(--sel)}
.id{font-weight:700;font-variant-numeric:tabular-nums}
.lic{font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:1px 4px;white-space:nowrap}
.src{color:var(--mut);display:inline-flex}
.night{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.night .k{font-size:11px;color:var(--mut)}
.night .v{font-weight:700;font-size:16px}
.bar{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--c1),var(--c2));width:120px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.g{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start}
.g a{color:var(--tx);font-weight:600;text-decoration:none}
.g small{display:block;color:var(--mut)}
svg{width:16px;height:16px;flex:none}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out;padding:16px}
#lb img{max-width:100%;max-height:100%}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--acc);color:#04120a;padding:8px 14px;border-radius:8px;font-weight:600;display:none;z-index:10}
</style>
</head>

<header>
  <h1><svg><use href="#i-snow"/></svg>Референсы</h1>
  <span class="cnt"><svg style="vertical-align:-3px"><use href="#i-check"/></svg> <b id="n">0</b>/<span id="tot"></span></span>
  <button class="btn pri" id="copy"><svg><use href="#i-copy"/></svg>Скопировать выбор</button>

  <nav class="chips" id="nav"></nav>
</header>

const ICON={a:'aur',b:'tree',c:'step',d:'rock',e:'grass',f:'hut',g:'ice',h:'mtn',i:'deer',j:'plane'};
const KEY='echo-refs-selection-v1';
let sel={};try{sel=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){sel={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(sel))}catch(e){}};
const $=s=>document.querySelector(s);
const ic=n=>`<svg><use href="#i-${n}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sw=(c,l)=>c?`<span class="sw"><i style="background:${c}"></i>${l}</span>`:'';
$('#tot').textContent=D.imgs.length;
const N=D.night;
$('#night').innerHTML=[['снег: свет',N.lit],['снег: тень',N.shd],['небо',N.sky],['сияние',N.aur],['окна',N.warm]].map(([l,c])=>`<div><div class="k">${l}</div><div style="display:flex;gap:6px;align-items:center"><i style="display:inline-block;width:34px;height:22px;border-radius:5px;background:${c};border:1px solid var(--line)"></i><span class="v" style="font-size:12px">${c}</span></div></div>`).join('')+
 `<div><div class="k">свет / тень</div><div class="v">×${N.ratio}</div></div><div><div class="k">ср. яркость кадра</div><div class="v">${N.Y}</div></div><div><div class="k">тень синее света</div><div class="v">B/R 1.3 vs 1.0</div></div>`;
let nav='',html='';
for(const [c,info] of Object.entries(D.cats)){
  const imgs=D.imgs.filter(x=>x.cat===c);
  nav+=`<a class="chip" href="#s-${c}">${info.name.split(',')[0]} <b>${imgs.length}</b></a>`;
  html+=`<section id="s-${c}"><div class="sh"><h2>${ic(ICON[c])}${esc(info.name)}</h2>${sw(info.lit,'свет')}${sw(info.shd,'тень')}${sw(info.sky,'небо')}${info.ratio?`<span class="sw">×${info.ratio}</span>`:''}</div><div class="grid">`+
  imgs.map(x=>`<div class="card${sel[x.id]?' on':''}" id="c-${x.id}"><img loading="lazy" src="${x.file}" alt="${esc(x.title)}" data-full="${x.file}"><div class="meta"><label><input type="checkbox" data-id="${x.id}"${sel[x.id]?' checked':''}><span class="id">${x.id}</span> беру как образец</label><span class="lic" title="${esc(x.author)}">${esc(x.license)}</span><a class="src" href="${x.source}" target="_blank" rel="noopener" title="${esc(x.title)} — ${esc(x.author)}">${ic('link')}</a></div></div>`).join('')+`</div></section>`;
}
$('#nav').innerHTML=nav+`<a class="chip" href="#games-s">Игры <b>${D.games.length}</b></a>`;
$('#cats').innerHTML=html;
$('#games').innerHTML=D.games.map(([n,u,note,off])=>`<div class="g">${ic('game')}<div><a href="${u}" target="_blank" rel="noopener">${esc(n)}</a>${off?` · <a href="${off}" target="_blank" rel="noopener" style="font-weight:400;color:var(--mut)">сайт</a>`:''}<small>${esc(note)}</small></div></div>`).join('');
const upd=()=>{$('#n').textContent=Object.keys(sel).length};upd();
document.addEventListener('change',e=>{const id=e.target.dataset&&e.target.dataset.id;if(!id)return;if(e.target.checked)sel[id]=1;else delete sel[id];$('#c-'+id).classList.toggle('on',e.target.checked);save();upd();});
document.addEventListener('click',e=>{const im=e.target.closest('.card img');if(im){$('#lb img').src=im.dataset.full;$('#lb').style.display='flex';}});
$('#lb').onclick=()=>{$('#lb').style.display='none'};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').style.display='none'});
$('#clr').onclick=()=>{if(!confirm('Сбросить выбор?'))return;sel={};save();document.querySelectorAll('input[data-id]').forEach(i=>{i.checked=false;$('#c-'+i.dataset.id).classList.remove('on')});upd();};
$('#copy').onclick=async()=>{
  const ids=D.imgs.filter(x=>sel[x.id]);
  const txt=ids.length?`Беру как образец (${ids.length}):\n`+ids.map(x=>`${x.id} [${D.cats[x.cat].name}] references/${x.file} — ${x.title}`).join('\n'):'Ничего не выбрано';
  try{await navigator.clipboard.writeText(txt)}catch(e){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(_){}t.remove();}
  const T=$('#toast');T.textContent=ids.length?`Скопировано: ${ids.length}`:'Ничего не выбрано';T.style.display='block';setTimeout(()=>T.style.display='none',1600);
};
</script>
</body>
