</text><text x="670.0" y="282.0" text-anchor="middle" class="ad-t2">mountains, ice, clutter</text><rect x="854.0" y="128.0" width="168" height="68" rx="6" class="ad-bx ad-x"/><text x="938.0" y="158.0" text-anchor="middle" class="ad-t1">Passport registry</text><text x="938.0" y="174.0" text-anchor="middle" class="ad-t2">(Physics context)</text><rect x="224.6" y="99.0" width="86.8" height="16" rx="3" class="ad-lbbg"/><text x="268.0" y="111.0" text-anchor="middle" class="ad-lb">height, snow</text><rect x="349.0" y="99.0" width="106.0" height="16" rx="3" class="ad-lbbg"/><text x="402.0" y="111.0" text-anchor="middle" class="ad-lb">seating on snow</text><rect x="779.8" y="99.0" width="48.4" height="16" rx="3" class="ad-lbbg"/><text x="804.0" y="111.0" text-anchor="middle" class="ad-lb">trunks</text><rect x="783.0" y="140.0" width="42.0" height="16" rx="3" class="ad-lbbg"/><text x="804.0" y="152.0" text-anchor="middle" class="ad-lb">walls</text><rect x="779.8" y="207.0" width="48.4" height="16" rx="3" class="ad-lbbg"/><text x="804.0" y="219.0" text-anchor="middle" class="ad-lb">shapes</text></svg>