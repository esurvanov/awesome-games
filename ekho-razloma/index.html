<meta charset="utf-8">
<title>Северный Разлом</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;700;900&family=Onest:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #050814;
    --ink: #e8f4ff;
    --dim: #8398bd;
    --ice: #7fe3ff;
    --amber: #ffb347;
    --aur: #5cf5c0;
    --vio: #b98bff;
    --danger: #ff4d7d;
    --panel: rgba(9, 16, 38, 0.62);
    --line: rgba(127, 227, 255, 0.22);
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Onest, system-ui, -apple-system, sans-serif; font-size: 14px;
    overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .i { width: 18px; height: 18px; flex: none; }
  .t { font-family: Tektur, "Arial Narrow", system-ui, sans-serif; }

  /* overlays */
  #vign { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(2, 4, 12, 0.75) 100%); }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s ease-out;
    background: radial-gradient(circle at 50% 50%, rgba(255, 77, 125, 0) 30%, rgba(255, 60, 110, .55) 100%); }
  #flash.on { opacity: 1; transition: none; }
  #boostFx { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s;
    background: radial-gradient(100% 80% at 50% 50%, transparent 50%, rgba(127, 227, 255, .22) 100%); }

  /* HUD */
  .hud { position: fixed; inset: 0; pointer-events: none;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .hud-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .score-wrap { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .score { font: 900 clamp(30px, 5.4vw, 48px)/1 Tektur, system-ui, sans-serif; letter-spacing: .02em;
    font-variant-numeric: tabular-nums; text-shadow: 0 0 22px rgba(127, 227, 255, .45); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); font: 700 14px Tektur, system-ui, sans-serif;
    font-variant-numeric: tabular-nums; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .chip.amber { color: var(--amber); border-color: rgba(255, 179, 71, .4); }
  .chip.bump { animation: bump .35s ease-out; }
  @keyframes bump { 0% { transform: scale(1.45); } 100% { transform: scale(1); } }
  .stat small { font: 500 11px Onest, system-ui, sans-serif; color: var(--dim); }
  .hud-right { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .icon-btn { pointer-events: auto; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .icon-btn:focus-visible, .btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .hud-bottom { position: absolute; left: 16px; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .shields { display: flex; gap: 4px; color: var(--ice); }
  .shields .i { width: 24px; height: 24px; filter: drop-shadow(0 0 6px rgba(127, 227, 255, .7)); transition: opacity .3s, color .3s; }
  .shields .off { opacity: .18; filter: none; color: var(--danger); }
  .boost { display: flex; align-items: center; gap: 8px; color: var(--amber); }
  .bar { width: min(300px, 46vw); height: 10px; border-radius: 6px; background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 179, 71, .3); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ff7a2a, #ffd36e);
    box-shadow: 0 0 14px #ffb347; }
  .boost.full .bar i { animation: glow .5s infinite alternate; }
  .boost.on .bar i { background: linear-gradient(90deg, #4fd8ff, #c7f6ff); box-shadow: 0 0 16px #7fe3ff; }
  .boost.on { color: var(--ice); }
  @keyframes glow { to { filter: brightness(1.5); } }

  #pops { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .pop { font: 900 26px Tektur, system-ui, sans-serif; letter-spacing: .03em; animation: pop .9s ease-out forwards;
    text-shadow: 0 0 18px currentColor; white-space: nowrap; }
  .pop.amber { color: var(--amber); } .pop.ice { color: var(--ice); } .pop.pink { color: var(--danger); }
  .pop.aur { color: var(--aur); font-size: 20px; }
  @keyframes pop { 0% { opacity: 0; transform: translateY(12px) scale(.7); } 20% { opacity: 1; transform: none; }
    100% { opacity: 0; transform: translateY(-30px); } }

  #sector { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); pointer-events: none; text-align: center;
    opacity: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #sector.show { animation: sector 2.4s ease-out forwards; }
  #sector b { font: 900 clamp(26px, 5vw, 40px)/1 Tektur, system-ui, sans-serif; letter-spacing: .18em; color: var(--aur);
    text-shadow: 0 0 24px currentColor; }
  #sector .dots { display: flex; gap: 6px; }
  #sector .dots span { width: 18px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .15); }
  #sector .dots span.on { background: var(--aur); box-shadow: 0 0 8px var(--aur); }
  @keyframes sector { 0% { opacity: 0; letter-spacing: .5em; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

  /* screens */
  .screen { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: flex-start;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(22px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(90deg, rgba(4, 7, 20, .88), rgba(4, 7, 20, .35) 55%, transparent 80%); overflow-y: auto; }
  .screen.center { align-items: center; justify-content: center; background: rgba(4, 7, 20, .62);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .panel { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 16px; }
  .screen:not(.center) .panel { margin-left: clamp(0px, 4vw, 48px); margin-bottom: clamp(0px, 3vh, 40px); }
  .eyebrow { display: flex; align-items: center; gap: 8px; color: var(--aur); font: 700 12px Tektur, system-ui, sans-serif;
    letter-spacing: .22em; text-transform: uppercase; }
  .title { margin: 0; font: 900 clamp(44px, 9vw, 84px)/.9 Tektur, system-ui, sans-serif; text-transform: uppercase;
    letter-spacing: .01em; text-wrap: balance;
    background: linear-gradient(100deg, #a5ffdd 0%, #7fe3ff 45%, #c9a4ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 26px rgba(92, 245, 192, .25)); }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { pointer-events: auto; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    height: 52px; padding: 0 24px; border-radius: 12px; border: 0; cursor: pointer;
    background: var(--ice); color: #04101f; font: 700 18px Tektur, system-ui, sans-serif; letter-spacing: .04em;
    box-shadow: 0 0 34px rgba(127, 227, 255, .35); transition: transform .12s, box-shadow .2s; }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 0 44px rgba(127, 227, 255, .55); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
  .btn kbd { background: rgba(4, 16, 31, .15); border-color: rgba(4, 16, 31, .3); color: inherit; }
  .btn.ghost kbd { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .18); }
  kbd { font: 700 11px Tektur, system-ui, sans-serif; padding: 2px 6px; border-radius: 5px; min-width: 12px; text-align: center;
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .2); border-bottom-width: 2px; color: var(--ink); }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px;
    display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .card .lbl { display: flex; align-items: center; gap: 6px; font: 600 12px Onest, system-ui, sans-serif; color: var(--dim); }
  .keys { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; min-height: 22px; }
  .chain { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .node { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); font: 600 12px Onest, system-ui, sans-serif; white-space: nowrap; }
  .arrow { color: var(--dim); }
  .c-amber { color: var(--amber); } .c-ice { color: var(--ice); } .c-pink { color: var(--danger); } .c-aur { color: var(--aur); } .c-vio { color: var(--vio); }
  .touch-only { display: none; }
  @media (pointer: coarse) { .touch-only { display: flex; } .desk-only { display: none !important; } }

  .big-score { font: 900 clamp(52px, 12vw, 88px)/1 Tektur, system-ui, sans-serif; font-variant-numeric: tabular-nums;
    color: var(--ink); text-shadow: 0 0 30px rgba(127, 227, 255, .45); }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .tile b { font: 700 18px Tektur, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .record { align-self: flex-start; background: rgba(255, 179, 71, .14); border-color: rgba(255, 179, 71, .5); color: var(--amber);
    animation: glow .6s infinite alternate; }
  .over-panel { max-width: 440px; align-items: stretch; text-align: left; }

  #boostBtn { position: fixed; right: 18px; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); width: 76px; height: 76px;
    border-radius: 50%; border: 2px solid rgba(255, 179, 71, .6); background: rgba(40, 22, 6, .5); color: var(--amber);
    align-items: center; justify-content: center; pointer-events: auto; touch-action: none; }
  #boostBtn .i { width: 34px; height: 34px; }
  #boostBtn.on { border-color: var(--ice); color: var(--ice); background: rgba(10, 40, 60, .55); }

  @media (max-width: 560px) {
    .grid3 { grid-template-columns: 1fr 1fr 1fr; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .screen { background: linear-gradient(0deg, rgba(4, 7, 20, .92) 40%, rgba(4, 7, 20, .2) 85%, transparent); }
    .stat small { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pop, #sector.show, .chip.bump, .record, .boost.full .bar i { animation-duration: .01s; }
  }
</style>

  <defs>

    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 21h8M12 16v5M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></symbol>

    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></symbol>

    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v5M12 10V4a1.5 1.5 0 0 1 3 0v6M15 10V6a1.5 1.5 0 0 1 3 0v7a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-2.5-4a1.5 1.5 0 0 1 2.5-1.6L9 14"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M12 2.5l8 3v6.2c0 5-3.5 8.3-8 9.8-4.5-1.5-8-4.8-8-9.8V5.5zM9 9l6 6M15 9l-6 6"/></symbol>
    <symbol id="i-mult" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>

</svg>

<canvas id="c"></canvas>
<div id="vign"></div>
<div id="boostFx"></div>
<div id="flash"></div>

<div class="hud" id="hud" hidden>
  <div class="hud-top">
    <div class="score-wrap">
      <div class="score" id="score">0</div>
      <div class="row">
        <span class="chip amber" id="mult" title="Множитель"><svg class="i"><use href="#i-ring"/></svg><span id="multV">×1</span></span>
        <span class="chip stat" title="Дистанция"><svg class="i c-aur"><use href="#i-flag"/></svg><span id="dist">0</span><small>м</small></span>
        <span class="chip stat" title="Скорость"><svg class="i c-ice"><use href="#i-gauge"/></svg><span id="spd">0</span><small>км/ч</small></span>
      </div>
    </div>
    <div class="hud-right">
      <div class="row">
        <button class="icon-btn" id="btnSound" aria-label="Звук"><svg class="i"><use href="#i-sound"/></svg></button>
        <button class="icon-btn" id="btnPause" aria-label="Пауза"><svg class="i"><use href="#i-pause"/></svg></button>
      </div>
    </div>
  </div>
  <div class="hud-bottom">
    <div class="shields" id="shields" title="Щит"></div>
    <div class="boost" id="boost" title="Прорыв">
      <svg class="i"><use href="#i-bolt"/></svg>
      <div class="bar"><i id="boostFill"></i></div>
      <kbd class="desk-only">Space</kbd>
    </div>
  </div>
</div>
<button id="boostBtn" class="touch-only" hidden aria-label="Прорыв"><svg class="i"><use href="#i-bolt"/></svg></button>

<div id="pops"></div>
<div id="sector"><b id="sectorName">СЕКТОР 2</b><div class="dots" id="sectorDots"></div></div>

<!-- menu -->
<div class="screen" id="menu">
  <div class="panel">
    <div class="eyebrow"><svg class="i"><use href="#i-crystal"/></svg>ледяной каньон · ∞</div>
    <h1 class="title">Северный<br>Разлом</h1>
    <div class="row">
      <span class="chip amber"><svg class="i"><use href="#i-trophy"/></svg><span id="bestMenu">0</span></span>
      <span class="chip"><svg class="i c-aur"><use href="#i-flag"/></svg><span id="bestDistMenu">0</span>&nbsp;<small style="color:var(--dim);font:500 11px Onest,sans-serif">м</small></span>
    </div>
    <div class="btns">
      <button class="btn" id="btnStart"><svg class="i"><use href="#i-play"/></svg>Старт<kbd class="desk-only">Enter</kbd></button>
    </div>
    <div class="grid3">
      <div class="card">
        <div class="keys desk-only"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>←↑↓→</kbd></div>
        <div class="keys touch-only"><svg class="i c-ice"><use href="#i-hand"/></svg></div>
        <div class="lbl"><svg class="i c-ice"><use href="#i-move"/></svg>руль</div>
      </div>
      <div class="card">
        <div class="keys desk-only"><kbd>Space</kbd><kbd>Shift</kbd></div>
        <div class="keys touch-only"><svg class="i c-amber"><use href="#i-bolt"/></svg></div>
        <div class="lbl"><svg class="i c-amber"><use href="#i-bolt"/></svg>прорыв</div>
      </div>
      <div class="card">
        <div class="keys"><svg class="i c-ice"><use href="#i-shield"/></svg><svg class="i c-ice"><use href="#i-shield"/></svg><svg class="i c-ice"><use href="#i-shield"/></svg></div>
        <div class="lbl"><svg class="i c-pink"><use href="#i-x"/></svg>3 удара</div>
      </div>
    </div>
    <div class="chain">
      <span class="node"><svg class="i c-amber"><use href="#i-shard"/></svg>осколки</span><span class="arrow">→</span>
      <span class="node"><svg class="i c-amber"><use href="#i-bolt"/></svg>энергия</span><span class="arrow">→</span>
      <span class="node"><svg class="i c-ice"><use href="#i-burst"/></svg>лёд вдребезги</span>
    </div>
    <div class="chain">
      <span class="node"><svg class="i c-ice"><use href="#i-crystal"/></svg>облети</span>
      <span class="node"><svg class="i c-pink"><use href="#i-laser"/></svg>над / под</span>
      <span class="node"><svg class="i c-amber"><use href="#i-ring"/></svg>×2…×8</span>
    </div>
  </div>
</div>

<!-- pause -->
<div class="screen center" id="pause" hidden>
  <div class="panel" style="align-items:center">
    <div class="eyebrow"><svg class="i"><use href="#i-pause"/></svg>пауза</div>
    <div class="btns">
      <button class="btn" id="btnResume"><svg class="i"><use href="#i-play"/></svg>Дальше<kbd class="desk-only">P</kbd></button>
      <button class="btn ghost" id="btnMenu2"><svg class="i"><use href="#i-home"/></svg></button>
    </div>
  </div>
</div>

<!-- game over -->
<div class="screen center" id="over" hidden>
  <div class="panel over-panel">
    <div class="eyebrow" style="color:var(--danger)"><svg class="i"><use href="#i-x"/></svg>корпус разбит</div>
    <div class="big-score" id="finalScore">0</div>
    <span class="chip record" id="newRecord" hidden><svg class="i"><use href="#i-trophy"/></svg>новый рекорд</span>
    <div class="tiles">
      <div class="tile"><svg class="i c-aur"><use href="#i-flag"/></svg><b id="fDist">0</b><small style="color:var(--dim)">м</small></div>
      <div class="tile"><svg class="i c-amber"><use href="#i-shard"/></svg><b id="fShards">0</b><small style="color:var(--dim)">осколки</small></div>
      <div class="tile"><svg class="i c-ice"><use href="#i-burst"/></svg><b id="fSmash">0</b><small style="color:var(--dim)">лёд</small></div>
      <div class="tile"><svg class="i c-amber"><use href="#i-ring"/></svg><b id="fMult">×1</b><small style="color:var(--dim)">макс</small></div>
    </div>
    <div class="row" style="color:var(--dim)">
      <svg class="i c-amber"><use href="#i-trophy"/></svg><span class="t" id="fBest" style="color:var(--ink);font-weight:700">0</span>
    </div>
    <div class="btns">
      <button class="btn" id="btnRestart"><svg class="i"><use href="#i-restart"/></svg>Ещё раз<kbd class="desk-only">R</kbd></button>
      <button class="btn ghost" id="btnMenu"><svg class="i"><use href="#i-home"/></svg>Меню</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
const $ = (id) => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

const Sound = (() => {
  let ac = null, master, music, filt, delay, drums, sfx, arpBus, bassBus, noiseBuf, boostG, boostF;
  let nextT = 0, step = 0, intensity = 0, muted = store.get('rift-muted', false);
  const BPM = 112, S = 60 / BPM / 4;
  const CH = [[57, 60, 64, 69], [53, 57, 60, 65], [48, 52, 55, 60], [55, 59, 62, 67]];

  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

    master = ac.createGain(); master.gain.value = muted ? 0 : 0.75;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
    master.connect(comp); comp.connect(ac.destination);
    music = ac.createGain(); music.gain.value = 0.5;
    filt = ac.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 900; filt.Q.value = 0.8;
    music.connect(filt); filt.connect(master);
    delay = ac.createDelay(1.5); delay.delayTime.value = S * 3;
    const fb = ac.createGain(); fb.gain.value = 0.4; const wet = ac.createGain(); wet.gain.value = 0.5;
    delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(filt);
    arpBus = ac.createGain(); arpBus.connect(music); arpBus.connect(delay);
    const bl = ac.createBiquadFilter(); bl.type = 'lowpass'; bl.frequency.value = 380; bl.Q.value = 3;
    bassBus = ac.createGain(); bassBus.connect(bl); bl.connect(master);
    drums = ac.createGain(); drums.gain.value = 0.8; drums.connect(master);
    sfx = ac.createGain(); sfx.gain.value = 0.8; sfx.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const ns = ac.createBufferSource(); ns.buffer = noiseBuf; ns.loop = true;
    boostF = ac.createBiquadFilter(); boostF.type = 'bandpass'; boostF.frequency.value = 500; boostF.Q.value = 1.4;
    boostG = ac.createGain(); boostG.gain.value = 0;
    ns.connect(boostF); boostF.connect(boostG); boostG.connect(sfx); ns.start();
    nextT = ac.currentTime + 0.06;

  }
  function env(g, t, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);

    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);

    o.start(t); o.stop(t + dur + 0.05);

  function noise(t, dur, peak, type, freq, dest, q = 0.7, f2) {

    if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);

    init,
    get muted() { return muted; },
    toggle() { muted = !muted; store.set('rift-muted', muted); if (master) master.gain.setTargetAtTime(muted ? 0 : 0.75, ac.currentTime, 0.05); return muted; },
    suspend(on) { if (!ac) return; on ? ac.suspend() : ac.resume(); },
    setIntensity(v) { intensity = v; },
    setSpeed(n) { if (filt) filt.frequency.setTargetAtTime(700 + n * 4200, ac.currentTime, 0.3); },
    setBoost(on) { if (!boostG) return; boostG.gain.setTargetAtTime(on ? 0.22 : 0, ac.currentTime, 0.08); boostF.frequency.setTargetAtTime(on ? 1400 : 500, ac.currentTime, 0.2); },

    ring() { if (!ac) return; const t = ac.currentTime; osc('sine', 300, t, 0.35, 0.2, sfx, 0.01, 0, 1400);
      [0, 4, 7, 12].forEach((iv, i) => osc('triangle', mtof(72 + iv), t + i * 0.05, 0.3, 0.12, sfx)); },
    hit() { if (!ac) return; const t = ac.currentTime; noise(t, 0.45, 0.6, 'lowpass', 1400, sfx, 1, 200); osc('sine', 110, t, 0.4, 0.6, sfx, 0.002, 0, 30); },
    smash() { if (!ac) return; const t = ac.currentTime; noise(t, 0.3, 0.35, 'highpass', 2500, sfx, 0.7);
      for (let i = 0; i < 4; i++) osc('sine', rand(1800, 4200), t + i * 0.025, 0.25, 0.05, sfx); },
    near() { if (!ac) return; noise(ac.currentTime, 0.25, 0.2, 'bandpass', 900, sfx, 2, 3000); },
    crash() { if (!ac) return; const t = ac.currentTime; noise(t, 1.4, 0.8, 'lowpass', 2500, sfx, 0.8, 80); osc('sawtooth', 160, t, 1.2, 0.3, sfx, 0.01, 0, 25); },
    start() { if (!ac) return; const t = ac.currentTime; [57, 64, 69, 76].forEach((m, i) => osc('triangle', mtof(m), t + i * 0.07, 0.35, 0.14, sfx)); },
    sector() { if (!ac) return; const t = ac.currentTime; [69, 76, 81, 88].forEach((m, i) => osc('sine', mtof(m), t + i * 0.09, 0.6, 0.1, sfx)); },
  };

})();

const NOISE = `
float h21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

`;

    float n = fbm(p * vec2(.024, .016));

    float slope = n.y;

  if (k) { keys[k] = true; if (state === 'play' || e.code.startsWith('Arrow')) e.preventDefault(); }
  if (e.repeat) return;
  if ((state === 'menu' || state === 'over') && (e.code === 'Enter' || e.code === 'NumpadEnter' || (e.code === 'KeyR' && state === 'over'))) { e.preventDefault(); startGame(); }
  else if (e.code === 'KeyP' || e.code === 'Escape') { if (state === 'play') setPause(true); else if (state === 'pause') setPause(false); }
  else if (e.code === 'KeyM') { Sound.init(); Sound.toggle(); renderSoundBtn(); }
});
addEventListener('keyup', (e) => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; boostHeld = false; setPause(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });

canvas.addEventListener('pointerdown', (e) => {
  if (state !== 'play' || pointer.active) return;
  pointer.active = true; pointer.id = e.pointerId; pointer.sx = e.clientX; pointer.sy = e.clientY;
  pointer.bx = ship.x; pointer.by = ship.y; pointer.tx = ship.x; pointer.ty = ship.y;
});
addEventListener('pointermove', (e) => {
  if (!pointer.active || e.pointerId !== pointer.id) return;
  const k = 26 / Math.min(innerWidth, 900) * (coarse ? 1.6 : 1.1);
  pointer.tx = clamp(pointer.bx + (e.clientX - pointer.sx) * k, -XMAX, XMAX);
  pointer.ty = clamp(pointer.by - (e.clientY - pointer.sy) * k, YMIN, YMAX);
});
const endPointer = (e) => { if (e.pointerId === pointer.id) { pointer.active = false; pointer.id = null; } };
addEventListener('pointerup', endPointer); addEventListener('pointercancel', endPointer);
boostBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); boostHeld = true; boostBtn.classList.add('on'); });
const boostOff = () => { boostHeld = false; boostBtn.classList.remove('on'); };
boostBtn.addEventListener('pointerup', boostOff); boostBtn.addEventListener('pointercancel', boostOff); boostBtn.addEventListener('pointerleave', boostOff);
addEventListener('contextmenu', (e) => { if (state === 'play') e.preventDefault(); });

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  partMat.uniforms.uScale.value = h * renderer.getPixelRatio() * 0.5 / Math.tan(camera.fov * Math.PI / 360);
}
addEventListener('resize', resize);

/* ============================ LOOP ============================ */
const camLook = new THREE.Vector3(), camPos = new THREE.Vector3();
let camOffZ = 10;
function update(dt) {
  T += dt;
  const playing = state === 'play';

  // --- speed
  if (playing) {
    const base = Math.min(46 + G.dist * 0.0042, 128);
    const wantBoost = (keys.boost || boostHeld);
    G.boosting = wantBoost && G.energy > 0.01 && (G.boosting || G.energy > 0.12);
    if (G.boosting) G.energy = Math.max(0, G.energy - dt * 0.32);
    G.slow = damp(G.slow, 1, 1.4, dt);
    speed = damp(speed, base * (G.boosting ? 1.6 : 1) * G.slow, G.boosting ? 3 : 1.6, dt);
    G.inv = Math.max(0, G.inv - dt);
    Sound.setBoost(G.boosting); Sound.setSpeed(clamp((speed - 40) / 110, 0, 1));
  } else if (state === 'menu') speed = damp(speed, 38, 1, dt);
  else speed = damp(speed, 10, 1.2, dt);

  const prevZ = ship.z;
  ship.z -= speed * dt;
  if (playing) G.dist += speed * dt;

  // --- steering
  if (playing) {
    if (pointer.active) {
      ship.vx = clamp((pointer.tx - ship.x) * 8, -28, 28);
      ship.vy = clamp((pointer.ty - ship.y) * 8, -22, 22);
    } else {
      const ix = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), iy = (keys.up ? 1 : 0) - (keys.down ? 1 : 0);
      ship.vx = damp(ship.vx, ix * 21, 7, dt); ship.vy = damp(ship.vy, iy * 15, 7, dt);
    }
    ship.x += ship.vx * dt; ship.y += ship.vy * dt;
    if (ship.x < -XMAX || ship.x > XMAX) { ship.x = clamp(ship.x, -XMAX, XMAX); ship.vx *= 0.3; }
    if (ship.y < YMIN || ship.y > YMAX) { ship.y = clamp(ship.y, YMIN, YMAX); ship.vy *= 0.3; }
  } else if (state === 'menu') {
    const nx = Math.sin(T * 0.45) * 5.5, ny = 4 + Math.sin(T * 0.7) * 1.3;
    ship.vx = dt > 0 ? (nx - ship.x) / dt : 0; ship.vy = dt > 0 ? (ny - ship.y) / dt : 0;
    ship.x = nx; ship.y = ny;
  }
  const sg = ship.group;
  sg.position.set(ship.x, ship.y, ship.z);
  sg.rotation.z = damp(sg.rotation.z, -ship.vx * 0.034 + Math.sin(T * 1.7) * 0.03, 8, dt);
  sg.rotation.x = damp(sg.rotation.x, ship.vy * 0.024, 8, dt);
  sg.rotation.y = damp(sg.rotation.y, -ship.vx * 0.012, 8, dt);
  if (playing) sg.visible = G.inv > 0 ? (Math.floor(T * 18) % 2 === 0) : true;

  const boosting = playing && G.boosting;
  const eScale = boosting ? 3.2 : 1.8 + Math.sin(T * 40) * 0.12;
  engineGlows.forEach((g, i) => { g.scale.setScalar(i % 2 ? eScale * 0.4 : eScale); if (i % 2 === 0) g.material = glowMat(boosting ? 0x7fe3ff : 0xff9a3c, 1); });

  // trails
  if (sg.visible || state !== 'dead') {
    sg.updateMatrixWorld();
    trailL.push(tips[0].getWorldPosition(tmpV)); trailR.push(tips[1].getWorldPosition(tmpV));
    tmpV.set(0, -0.05, 2.3); sg.localToWorld(tmpV); trailE.push(tmpV);
  }
  const trailO = state === 'dead' || state === 'over' ? 0 : 1;
  trailL.mat.uniforms.uO.value = trailR.mat.uniforms.uO.value = trailO * (boosting ? 1.6 : 0.9);
  trailE.mat.uniforms.uO.value = trailO * (boosting ? 1.2 : 0.7);
  trailE.mat.uniforms.uC.value.setHex(boosting ? 0x7fe3ff : 0xff8a30);

  // --- spawning
  if (playing) {
    while (G.nextZ > ship.z - 430) {
      const len = spawnPattern(G.nextZ);
      G.nextZ -= len + lerp(58, 24, diff()) + rand(0, 18);
    }
    const sec = Math.floor(G.dist / 2500);
    if (sec !== G.sector) { G.sector = sec; setPalette(sec); showSector(sec); }
  } else if (state === 'menu') {
    while (G.nextZ > ship.z - 430) { PATTERNS.shards(G.nextZ); G.nextZ -= 110; }
  }

  // --- objects
  const crossed = (z) => prevZ >= z && ship.z < z;
  for (let i = objs.length - 1; i >= 0; i--) {
    const o = objs[i];
    if (o.dead) { objs.splice(i, 1); continue; }
    if (o.z > ship.z + 30) { remove(o); objs.splice(i, 1); continue; }
    switch (o.type) {
      case 'shard': {
        o.inner.rotation.y += dt * 3; o.inner.rotation.x += dt * 1.3;
        o.mesh.position.y = o.y + Math.sin(T * 3 + o.ph) * 0.25;
        if (!playing) break;
        const dx = ship.x - o.x, dy = ship.y - o.y, dz = ship.z - o.z, d2 = dx * dx + dy * dy + dz * dz;
        if (G.boosting && d2 < 64) { const k = Math.min(1, dt * 10); o.x += dx * k; o.y += dy * k; o.z += dz * k; o.mesh.position.set(o.x, o.y, o.z); }
        if (d2 < (G.boosting ? 6 : 2.9) || (crossed(o.z) && dx * dx + dy * dy < 2.9)) collectShard(o);
        break;
      }
      case 'ring': {
        o.mesh.rotation.z += dt * 0.8;
        if (o.done) { o.mesh.scale.multiplyScalar(1 + dt * 3); break; }
        if (playing && crossed(o.z)) { const dx = ship.x - o.x, dy = ship.y - o.y; if (dx * dx + dy * dy < 2.2 * 2.2) collectRing(o); }
        break;
      }
      case 'crystal': {
        if (!playing || o.z < ship.z - o.r - 2 || o.z > ship.z + o.r + 2) break;
        const dx = ship.x - o.x, dz = ship.z - o.z;
        if (dx * dx + dz * dz < (o.r + 0.75) ** 2 && ship.y < o.top + 0.3) { if (G.boosting) smash(o); else if (G.inv <= 0) { hurt(); } }
        break;
      }
      case 'laser': {
        if (!playing || !crossed(o.z)) break;
        const dy = Math.abs(ship.y - o.y);
        if (dy < 0.85) hurt();
        else if (dy < 1.7) { G.bonus += 30 * G.mult; pop('впритык +' + 30 * G.mult, 'aur'); Sound.near(); }
        break;
      }
      case 'sweep': {
        o.x = Math.sin(T * o.w + o.ph) * o.amp; o.mesh.position.x = o.x;
        if (!playing || !crossed(o.z)) break;
        const dx = Math.abs(ship.x - o.x);
        if (dx < 0.95) hurt();
        else if (dx < 1.9) { G.bonus += 30 * G.mult; pop('впритык +' + 30 * G.mult, 'aur'); Sound.near(); }
        break;
      }
    }
  }
  LASER_GLOW.opacity = 0.28 + Math.sin(T * 38) * 0.07 + Math.sin(T * 7) * 0.05;

  // --- engine sparks
  if (sg.visible && state !== 'dead' && Math.random() < (boosting ? 1 : 0.5)) {
    tmpV.set(rand(-0.6, 0.6), -0.05, 2.4); sg.localToWorld(tmpV);
    emit(tmpV.x, tmpV.y, tmpV.z, rand(-1, 1), rand(-1, 1), rand(2, 6), rand(0.2, 0.45), boosting ? new THREE.Color(0x9fefff) : new THREE.Color(0xffa040), rand(0.15, 0.35), 0.5);
  }
  updateParticles(dt);

  // --- snow & streaks
  const cz = camera.position.z;
  for (let i = 0; i < SN; i++) {
    const o = i * 3;
    SNOW.p[o] += Math.sin(T * 0.5 + i) * dt * 0.8; SNOW.p[o + 1] -= dt * 1.2;
    if (SNOW.p[o + 2] > cz + 8) { SNOW.p[o + 2] -= 330; SNOW.p[o] = ship.x + rand(-45, 45); }
    if (SNOW.p[o + 1] < -1) SNOW.p[o + 1] += 30;
  }
  SNOW.geo.attributes.position.needsUpdate = true;
  const sl = speed * (boosting ? 0.2 : 0.09);
  for (let i = 0; i < STN; i++) {
    const s = stSeed[i];
    if (s.z > cz + 5) { s.z -= 270; s.x = ship.x + rand(-30, 30); s.y = rand(-1, 18); }
    if (Math.abs(s.x - ship.x) < 2.5 && Math.abs(s.y - ship.y) < 2) s.x += 5;
    const o = i * 6; stPos[o] = s.x; stPos[o + 1] = s.y; stPos[o + 2] = s.z; stPos[o + 3] = s.x; stPos[o + 4] = s.y; stPos[o + 5] = s.z + sl;
    if (s.z < cz - 270) s.z = cz - rand(0, 250);
  }
  stGeo.attributes.position.needsUpdate = true;
  stMat.opacity = damp(stMat.opacity, clamp((speed - 55) / 90, 0, 0.35) + (boosting ? 0.45 : 0), 4, dt);
  $('boostFx').style.opacity = boosting ? 1 : 0;

  // --- camera
  if (state === 'menu') {
    camPos.set(ship.x * 0.4 + Math.sin(T * 0.13) * 8, ship.y + 1.8 + Math.sin(T * 0.21) * 0.8, 0);
    camLook.set(ship.x, ship.y + 0.2, ship.z - 5);
    camOffZ = damp(camOffZ, 10.5, 1, dt);
  } else if (state === 'play' || state === 'pause') {
    camPos.set(ship.x * 0.6, ship.y * 0.62 + 2.7, 0);
    camLook.set(ship.x * 0.75, ship.y * 0.72 + 1.1, ship.z - 16);
    camOffZ = damp(camOffZ, boosting ? 7.2 : 8.4, 3, dt);
  } else {
    camPos.set(ship.x * 0.5 + 3, ship.y + 4, 0);
    camLook.set(ship.x, ship.y, ship.z - 4);
    camOffZ = damp(camOffZ, 16, 0.8, dt);
  }
  camera.position.x = damp(camera.position.x, camPos.x, 4, dt);
  camera.position.y = damp(camera.position.y, camPos.y, 4, dt);
  camera.position.z = ship.z + camOffZ;
  shake = Math.max(0, shake - dt * 2.2);
  if (shake > 0) { camera.position.x += rand(-1, 1) * shake * 0.4; camera.position.y += rand(-1, 1) * shake * 0.4; }
  camera.lookAt(camLook);
  camera.rotateZ(-ship.vx * 0.0035);
  const wantFov = (state === 'menu' ? 62 : 68) + clamp((speed - 45) * 0.14, 0, 14) + (boosting ? 9 : 0);
  if (Math.abs(fov - wantFov) > 0.01) { fov = damp(fov, wantFov, 3, dt); camera.fov = fov; camera.updateProjectionMatrix();
    partMat.uniforms.uScale.value = innerHeight * renderer.getPixelRatio() * 0.5 / Math.tan(fov * Math.PI / 360); }

  // --- world
  sky.position.copy(camera.position);
  terrain.position.z = Math.floor(camera.position.z / TSTEP) * TSTEP - TD / 2 + 60;
  terU.uTime.value = skyU.uTime.value = T;
  terU.uShip.value.copy(sg.position); if (!sg.visible) terU.uShip.value.y = 999;
  terU.uBoost.value = damp(terU.uBoost.value, boosting ? 1 : 0, 4, dt);
  aurA.lerp(tgtA, Math.min(1, dt * 0.6)); aurB.lerp(tgtB, Math.min(1, dt * 0.6));
  key.target.position.copy(sg.position); key.position.set(sg.position.x + 4, sg.position.y + 10, sg.position.z + 8);
  rim.target.position.copy(sg.position); rim.position.set(sg.position.x - 3, sg.position.y + 5, sg.position.z - 10);

  // --- HUD
  if (playing || state === 'pause') {
    setText(ui.score, 's', fmt(G.bonus + G.dist * 0.5));
    setText(ui.dist, 'd', fmt(G.dist));
    setText(ui.spd, 'v', String(Math.round(speed * 3.6)));
    ui.boostFill.style.width = (G.energy * 100).toFixed(1) + '%';
    ui.boost.classList.toggle('full', G.energy > 0.98 && !G.boosting);
    ui.boost.classList.toggle('on', G.boosting);
  }
}

let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min((now - lastT) / 1000, 0.05); lastT = now;
  if (state === 'pause') dt = 0;
  update(dt);
  renderer.render(scene, camera);
}

function boot(data) {
  if (data && typeof data.best === 'number' && data.best > best) best = data.best;
  resize(); resetGame(); G.nextZ = ship.z - 60;
  camera.position.set(0, 6, 12);
  trailL.reset(ship.group.position); trailR.reset(ship.group.position); trailE.reset(ship.group.position);
  renderSoundBtn(); refreshMenu();
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) { try { hot.snapshot(() => ({ best })); } catch (e) {} }
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
