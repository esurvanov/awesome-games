<meta charset="utf-8">
<title>Берёзовка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#EEF3F8; --dim:#9FB0C6; --panel:rgba(9,16,29,.72); --line:rgba(170,200,235,.16);
  --red:#D7263D; --gold:#E3B04B; --ice:#9AD1F0; --ok:#5BD08A; --navy:#0A1220;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--navy);color:var(--ink);font:14px/1.3 "PT Sans",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#game{position:fixed;inset:0;overflow:hidden}
#c{display:block;width:100%;height:100%;cursor:crosshair}
.ic{display:inline-block;vertical-align:middle;flex:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:5px;background:#EEF3F8;color:#0A1220;font:12px "Russo One",sans-serif;box-shadow:0 2px 0 #7d8ea6}
.btn{font:15px "Russo One",sans-serif;border:0;border-radius:8px;padding:12px 22px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:#fff;background:var(--red);box-shadow:0 3px 0 #8c1426}
.btn.alt{background:#24324a;box-shadow:0 3px 0 #111a29}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn:active{transform:translateY(2px);box-shadow:none}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#quest{position:absolute;left:16px;top:calc(16px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;padding:10px 12px;max-width:min(360px,calc(100vw - 200px))}
.qi{width:36px;height:36px;border-radius:8px;background:var(--red);display:grid;place-items:center;color:#fff;flex:none}
#qTitle{font:15px "Russo One",sans-serif;letter-spacing:.02em}
#qProg{color:var(--dim);display:flex;gap:8px;margin-top:3px;font-weight:700}
#qProg .ok{color:var(--ok)}
#qNav{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--gold);font:12px "Russo One",sans-serif;min-width:44px}
#qArrow{transition:transform .08s linear}
#rt{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;align-items:center}
#miniWrap{position:relative;width:170px;height:170px;border-radius:50%;overflow:hidden;border:2px solid rgba(238,243,248,.55);box-shadow:0 4px 18px rgba(0,0,0,.4)}
#mini{width:100%;height:100%;display:block}
#miniN{position:absolute;font:11px "Russo One",sans-serif;color:#fff;background:var(--red);border-radius:50%;width:18px;height:18px;display:grid;place-items:center;transform:translate(-50%,-50%)}
.row{display:flex;gap:10px;align-items:center;padding:6px 10px}
#clock,#temp{display:flex;gap:5px;align-items:center;font:13px "Russo One",sans-serif;font-variant-numeric:tabular-nums}
#temp{color:var(--ice)}
#lb{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.stam{display:flex;align-items:center;gap:8px;color:var(--gold)}
.bar{width:150px;height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#E3B04B,#ffd97a);border-radius:4px}
.bar i.buff{background:linear-gradient(90deg,#5BD08A,#b9ffcf)}
.chip{display:inline-flex;align-items:center;gap:5px;font:13px "Russo One",sans-serif;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.07)}
.chip.m{color:#ff8a8a}.chip.f{color:var(--ice)}.chip.r{color:var(--ok)}
#prompt{position:absolute;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 14px;font:14px "Russo One",sans-serif;white-space:nowrap}
#prompt .ic{color:var(--gold)}
#toasts{position:absolute;left:50%;top:calc(90px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{display:flex;align-items:center;gap:8px;padding:8px 14px;font:14px "Russo One",sans-serif;animation:tin .25s ease-out;white-space:nowrap}
.toast .ic{color:var(--gold)}
.toast.q{background:rgba(215,38,61,.88);border-color:transparent}.toast.q .ic{color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#zone{position:absolute;left:50%;top:26%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transition:opacity .8s;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#zone.on{opacity:1}
#zTx{font:clamp(26px,5vw,44px) "Russo One",sans-serif;letter-spacing:.06em}
#zIc{color:var(--gold)}
#speedo{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:150px;height:150px}
#spdNum{position:absolute;left:0;right:0;top:86px;text-align:center;font:24px "Russo One",sans-serif;font-variant-numeric:tabular-nums}
#spdU{position:absolute;left:0;right:0;top:114px;text-align:center;font:10px "Russo One",sans-serif;color:var(--dim)}
#keys{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:10px 12px;display:grid;grid-template-columns:auto auto;gap:6px 10px;align-items:center;font-size:13px}
#keys .k{display:flex;gap:4px;justify-content:flex-end}
#keys span.l{display:flex;align-items:center;gap:6px;color:var(--dim)}
#lockHint{position:absolute;left:50%;bottom:calc(160px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 14px;font:13px "Russo One",sans-serif;display:flex;gap:8px;align-items:center;pointer-events:none}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(255,255,255,.6)}

/* Dialog */
#dialog{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(620px,calc(100vw - 32px));padding:14px 16px;display:flex;gap:14px;align-items:flex-start;pointer-events:auto}
#dPort{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font:24px "Russo One",sans-serif;color:#fff;flex:none;border:2px solid rgba(255,255,255,.5)}
#dBody{flex:1;min-width:0}
#dName{font:13px "Russo One",sans-serif;color:var(--gold);letter-spacing:.04em}
#dText{font-size:18px;line-height:1.35;margin-top:4px;min-height:48px}
#dCh{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#dCh button{font:14px "PT Sans",sans-serif;font-weight:700;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);border-radius:8px;padding:7px 10px;cursor:pointer;display:flex;gap:8px;align-items:center}
#dCh button:hover,#dCh button:focus-visible{background:rgba(227,176,75,.2);outline:none}
#dNext{position:absolute;right:14px;bottom:10px;display:flex;gap:6px;align-items:center;color:var(--dim);font-size:12px}

/* Fishing */
#fish{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:12px 16px;width:min(360px,calc(100vw - 32px));display:flex;flex-direction:column;gap:10px;align-items:center}
#fState{display:flex;gap:8px;align-items:center;font:16px "Russo One",sans-serif}
#fState .ic{color:var(--ice)}
#fBar{position:relative;width:100%;height:16px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}
#fZone{position:absolute;top:0;bottom:0;background:rgba(91,208,138,.7);border-radius:8px}
#fMark{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:#fff;border-radius:2px;box-shadow:0 0 8px #fff}
#fKeys{display:flex;gap:14px;color:var(--dim);font-size:12px;align-items:center}

/* Map */
#mapOv{position:absolute;inset:0;background:rgba(6,11,20,.82);display:grid;place-items:center;pointer-events:auto}
#bigmap{width:min(86vh,calc(100vw - 32px));height:min(86vh,calc(100vw - 32px));border-radius:12px;border:2px solid rgba(238,243,248,.4)}
#mapClose{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px))}

/* Menu */
#menu{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 16px calc(40px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(10,18,32,0) 35%,rgba(10,18,32,.85) 100%)}
#menuIn{max-width:720px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:18px;align-items:flex-start}
#logo{font:clamp(44px,11vw,104px)/0.9 "Russo One",sans-serif;letter-spacing:.02em;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.45)}
#logo b{color:var(--gold);font-weight:400}
#feat{display:flex;flex-wrap:wrap;gap:8px}
#feat span{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.1);font:13px "Russo One",sans-serif}
#feat .ic{color:var(--gold)}
#mBtns{display:flex;gap:10px;flex-wrap:wrap}
#mKeys{display:flex;flex-wrap:wrap;gap:12px;color:var(--dim);font-size:13px}
#mKeys span{display:inline-flex;gap:5px;align-items:center}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--navy);font:18px "Russo One",sans-serif;z-index:20}
#loading>div{display:flex;flex-direction:column;align-items:center;gap:14px}
#ldMods{display:grid;grid-template-columns:repeat(4,auto);gap:6px}
.lmod{display:flex;gap:5px;align-items:center;padding:6px 9px;border-radius:8px;border:1px solid var(--line);font:12px "PT Sans",sans-serif;color:var(--dim);transition:color .3s,border-color .3s}
.lmod.ok{color:var(--ink);border-color:rgba(91,208,138,.6)}.lmod.ok .ic{color:var(--ok)}.lmod.bad{color:var(--red);border-color:rgba(215,38,61,.6)}
#compass{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(440px,34vw);height:32px;overflow:hidden;border-radius:8px;background:var(--panel);border:1px solid var(--line);-webkit-mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
#compass>*{position:absolute;top:0;transform:translateX(-50%)}
#compass .ct{width:1px;height:6px;background:rgba(255,255,255,.35)}
#compass .cl{top:8px;font:12px "Russo One",sans-serif;color:var(--dim);font-weight:400}#compass .cl.n{color:var(--red)}
#compass .cp{top:8px;color:var(--ice);opacity:.75}
#compass .cq{top:2px;display:flex;flex-direction:column;align-items:center;color:var(--gold);font:9px "Russo One",sans-serif}#compass .cq em{font-style:normal}
#compass::after{content:"";position:absolute;left:50%;top:0;width:2px;height:32px;background:linear-gradient(var(--ice),transparent);opacity:.6}
@media (max-width:640px){#compass{display:none}}
#ldBar{width:220px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#ldBar i{display:block;height:100%;width:10%;background:var(--gold);transition:width .2s}
#credOv{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,11,20,.8);pointer-events:auto;z-index:5}
#credIn{width:min(560px,calc(100vw - 32px));max-height:80vh;padding:16px;display:flex;flex-direction:column;gap:12px}
#credHead{display:flex;gap:8px;align-items:center;font:16px "Russo One",sans-serif;color:var(--gold)}
#credList{overflow:auto;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
#credList a{color:var(--ink);text-decoration:none}#credList a:hover{text-decoration:underline}
#credList span{color:var(--dim);font-variant-numeric:tabular-nums}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
#endCard{position:absolute;inset:0;display:grid;place-items:center;pointer-events:auto;background:rgba(6,11,20,.35)}
#endIn{padding:26px 28px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;max-width:calc(100vw - 32px)}
#endIn h2{margin:0;font:clamp(34px,8vw,56px) "Russo One",sans-serif;color:var(--gold);font-weight:400}
#endStats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#endStats span{display:flex;gap:6px;align-items:center;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.08);font:15px "Russo One",sans-serif}

/* Touch */
#touch{position:absolute;inset:0;pointer-events:none}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);transform:translate(-50%,-50%);display:none}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.45)}
#tBtns{position:absolute;right:16px;bottom:calc(200px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,58px);gap:10px;pointer-events:auto}
#tBtns button{width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(10,18,32,.55);color:#fff;font:15px "Russo One",sans-serif;display:grid;place-items:center}
@media (max-width:640px){
  #miniWrap{width:120px;height:120px}
  #quest{max-width:calc(100vw - 170px);padding:8px 10px}
  #qTitle{font-size:13px}
  .bar{width:100px}
  #keys{display:none}
  #dText{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}#zone{transition:none}}
</style>

  $('bPlay').innerHTML=ico('play',16)+'Новая игра';$('bCred').innerHTML=ico('star',16)+'Авторы';$('credHead').innerHTML=ico('star',18)+'Авторы';$('credClose').innerHTML='Закрыть';
  $('credList').innerHTML=CREDITS.map(c=>`<a href="${c[3]}" target="_blank" rel="noopener">${c[0]} — ${c[1]}</a><span>${c[2]}</span>`).join('');
  $('bCred').onclick=()=>{$('credOv').hidden=false};$('credClose').onclick=()=>{$('credOv').hidden=true};$('bCont').innerHTML=ico('flag',16)+'Продолжить';
  $('lockHint').innerHTML=ico('mouse',16)+'Клик — управление мышью';
  if(isTouch){$('touch').hidden=false}
}
function startGame(cont){
  audioInit();if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();
  $('menu').hidden=true;$('hud').hidden=false;state='play';clockT=11.5;
  player.pos.set(L.spawn[0],terrainH(...L.spawn),L.spawn[1]);player.h=PI;cam.yaw=0.3;
  const d=cont&&loadSave();
  if(d){applySave(d);bus.visible=false}else{try{localStorage.removeItem('berezovka_v1')}catch(e){}bus.userData.go=.01}
  renderQuest();$('keys').hidden=isTouch;setTimeout(()=>{$('keys').hidden=true},12000);
  $('lockHint').hidden=isTouch;
  camera.position.set(player.pos.x+3,player.pos.y+3,player.pos.z+6);
  if(!d){setTimeout(()=>say([['me','Берёзовка. Пять лет не был.'],['me','Бабушкин дом — по улице налево.']],()=>setStage(0)),1600)}
  if(!isTouch){try{const r=canvas.requestPointerLock();if(r&&r.catch)r.catch(()=>{})}catch(e){}}
}
$('bPlay').onclick=()=>startGame(false);$('bCont').onclick=()=>startGame(true);
async function boot(){
  resize();prog(10);
  try{await Promise.race([document.fonts.load('40px "Russo One"'),new Promise(r=>setTimeout(r,1500))])}catch(e){}
  buildLoadTiles();
  await Promise.all([loadModels(),loadTextures()]);
  buildStaticUI();buildWorld();motionSetup();motionGates();setupPost();resize();buildCompass();
  carS.y=terrainH(carS.pos.x,carS.pos.z);
  player.pos.set(L.spawn[0],terrainH(...L.spawn),L.spawn[1]);
  $('loading').remove();$('menu').hidden=false;state='menu';if(loadSave())$('bCont').hidden=false;
  window.__lookGate=()=>LOOK.gate({renderer,camera,scene,render,terrainH,player,updateForest,getTime:()=>clockT,setTime:t=>{clockT=t;updateEnv(0)}});
  setTimeout(()=>{try{window.__lookGate()}catch(e){console.warn('look gate',e)}},50);
  setTimeout(fxGate,400);
  requestAnimationFrame(loop);
}
boot();
</script>
