/text><rect x="586.0" y="128.0" width="168" height="68" rx="6" class="ad-bx ad-c"/><text x="670.0" y="158.0" text-anchor="middle" class="ad-t1">Интерфейс и цикл</text><text x="670.0" y="174.0" text-anchor="middle" class="ad-t2">ui, input, map</text><rect x="854.0" y="128.0" width="168" height="68" rx="6" class="ad-bx ad-x"/><text x="938.0" y="158.0" text-anchor="middle" class="ad-t1">Хранилище</text><text x="938.0" y="174.0" text-anchor="middle" class="ad-t2">localStorage</text><rect x="352.2" y="140.0" width="99.6" height="16" rx="3" class="ad-lbbg"/><text x="402.0" y="152.0" text-anchor="middle" class="ad-lb">грузит скрипты</text><rect x="358.6" y="99.0" width="86.8" height="16" rx="3" class="ad-lbbg"/><text x="402.0" y="111.0" text-anchor="middle" class="ad-lb">числа, сюжет</text><rect x="499.0" y="140.0" width="74.0" height="16" rx="3" class="ad-lbbg"/><text x="536.0" y="152.0" text-anchor="middle" class="ad-lb">update(dt)</text><rect x="511.8" y="207.0" width="48.4" height="16" rx="3" class="ad-lbbg"/><text x="536.0" y="219.0" text-anchor="middle" class="ad-lb">render</text><rect x="629.8" y="207.0" width="80.4" height="16" rx="3" class="ad-lbbg"/><text x="670.0" y="219.0" text-anchor="middle" class="ad-lb">Sound.frame</text><rect x="652.2" y="140.0" width="35.6" height="16" rx="3" class="ad-lbbg"/><text x="670.0" y="152.0" text-anchor="middle" class="ad-lb">сейв</text></svg>