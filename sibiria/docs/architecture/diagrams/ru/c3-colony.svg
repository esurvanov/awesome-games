<svg class="ad" viewBox="0 0 1072 324" role="img" aria-label="Компоненты контекста «Посёлок и люди»" xmlns="http://www.w3.org/2000/svg"><style>
svg.ad{--a-bg:#ffffff;--a-surface:#ffffff;--a-ink:#17181b;--a-ink2:#4a4d57;--a-ink3:#6b6e78;--a-line:#b9bcc6;--a-accent:#3b50d8}
