n</text><text x="670.0" y="166.0" text-anchor="middle" class="ad-t2">sim/*</text><text x="670.0" y="182.0" text-anchor="middle" class="ad-t2">world, no DOM or THREE</text><rect x="318.0" y="236.0" width="168" height="68" rx="6" class="ad-bx ad-c"/><text x="402.0" y="258.0" text-anchor="middle" class="ad-t1">Hall and people</text><text x="402.0" y="274.0" text-anchor="middle" class="ad-t2">render/*</text><text x="402.0" y="290.0" text-anchor="middle" class="ad-t2">three.js</text><rect x="586.0" y="236.0" width="168" height="68" rx="6" class="ad-bx ad-c"/><text x="670.0" y="258.0" text-anchor="middle" class="ad-t1">UI</text><text x="670.0" y="274.0" text-anchor="middle" class="ad-t2">ui/*</text><text x="670.0" y="290.0" text-anchor="middle" class="ad-t2">DOM over the canvas</text><rect x="50.0" y="20.0" width="168" height="68" rx="6" class="ad-bx ad-c"/><text x="134.0" y="42.0" text-anchor="middle" class="ad-t1">Core</text><text x="134.0" y="58.0" text-anchor="middle" class="ad-t2">core.js</text><text x="134.0" y="74.0" text-anchor="middle" class="ad-t2">RNG, Bus, Loop</text><rect x="227.8" y="140.0" width="80.4" height="16" rx="3" class="ad-lbbg"/><text x="268.0" y="152.0" text-anchor="middle" class="ad-lb">loads parts</text><rect x="483.0" y="140.0" width="106.0" height="16" rx="3" class="ad-lbbg"/><text x="536.0" y="152.0" text-anchor="middle" class="ad-lb">step, act, view</text><rect x="339.4" y="207.0" width="125.2" height="16" rx="3" class="ad-lbbg"/><text x="402.0" y="219.0" text-anchor="middle" class="ad-lb">pose, light, frame</text><rect x="511.8" y="207.0" width="48.4" height="16" rx="3" class="ad-lbbg"/><text x="536.0" y="219.0" text-anchor="middle" class="ad-lb">attach</text><rect x="649.0" y="99.0" width="42.0" height="16" rx="3" class="ad-lbbg"/><text x="670.0" y="111.0" text-anchor="middle" class="ad-lb">reads</text><rect x="626.6" y="207.0" width="86.8" height="16" rx="3" class="ad-lbbg"/><text x="670.0" y="219.0" text-anchor="middle" class="ad-lb">act